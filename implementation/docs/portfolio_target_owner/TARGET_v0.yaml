# 이 파일의 소스 담당자는 사용자 본인이다. 에이전트는 이 파일의 비중·테마·종목을 변경하지 않는다.
# 변경은 사용자가 이 파일을 수정하는 것으로만 일어나며, 수정 시 version을 올리고 새 adopted_at을 기록한다.
# 이전 버전은 git 이력으로 보존한다(덮어쓰기 금지, history-preserving).
#
# 이 파일은 A-S1(TARGET)과 A-S3(Strategy Theme)를 함께 담는다.
# A-S2(종목 식별, security_id 매핑)는 이 파일이 아니라 에이전트가 별도로 수행한다.

