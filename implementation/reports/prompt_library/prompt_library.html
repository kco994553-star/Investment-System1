ul{list-style:none;padding:0;margin:10px 0}li{padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}

.field-guide{min-width:0;margin:0 0 20px}.field-guide:last-child{margin-bottom:0}
.field-guide>label{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.5}
.field-required,.field-owner{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.field-required{margin-left:6px}.field-code-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px}
.field-description,.field-source{font-size:13px;line-height:1.6;margin:6px 0;overflow-wrap:anywhere}
.field-source{color:var(--muted)}.field-caption{font-weight:600}

.field-date-row button{min-height:44px;flex-shrink:0;border-radius:6px;font-size:13px;padding:8px 12px}
.field-error{display:block;color:var(--bad);font-size:13px;line-height:1.6;overflow-wrap:anywhere}

.field-mode-notes li{cursor:default;border:0;padding:2px 0;min-height:0;font-size:12px}.field-mode-notes li:hover{background:transparent}

ce 또는 검토할 가설에서 가져오고 사실·가정을 구분합니다.", "en-US": "Use macro evidence or a hypothesis to examine, distinguishing observed facts from assumptions."}}}, {"name": "macro_snapshot_summary", "required": true, "kind": "TEXT", "owner": "MACRO", "hint": "거시 변화의 직접·2차 수혜 후보를 조사할 기존 Macro 판단·근거 요약입니다. 새 국면 판단을 만들지 않습니다.", "guide": {"label": {"ko-KR": "기존 거시 판단 요약", "en-US": "Existing macro snapshot summary"}, "description": {"ko-KR": "거시 변화의 직접·2차 수혜 후보를 조사할 기존 Macro 판단·근거 요약입니다. 새 국면 판단을 만들지 않습니다.", "en-US": "An existing macro assessment and evidence summary used to research direct and indirect beneficiaries without inventing a new regime assessment."}, "placeholder": {"ko-KR": "예: 기존 거시 판단·변화·근거·기준일", "en-US": "Example: existing macro assessment, changes, evidence and cutoff"}, "source": {"ko-KR": "매크로 화면에 실제 MACRO Snapshot·저장된 거시 판단이 있을 때만 복사합니다. 없으면 미제공을 명시합니다.", "en-US": "Copy an actual MACRO snapshot or saved assessment from the Macro screen only when available. Otherwise state that data is unavailable."}}}]}, {"prompt_id": "plv1.idea.019", "prompt_code": "IDEA-019.v1.0", "title": "시장은 싫어하지만 사업이 개선되는 후보 찾기", "purpose": "{{system_summary}}에서 약한 시장평가와 개선되는 운영 Evidence가 동시에 존재하는지 확인하고 Turnaround와 Value Trap을 구분한다.", "domain": "DISCOVERY", "role": "CHALLENGE", "category": "RESEARCH_CANDIDATE_DISCOVERY", "subcategory": "CONTRARIAN_BLIND_SPOT", "tags": ["discovery", "challenge", "contrarian_blind_spot"], "keywords": ["시장은", "싫어하지만", "사업이", "개선되는", "후보", "찾기"], "aliases": ["시장이 싫어하지만 사업이 개선되는 기업 찾기"], "scopes": ["UNIVERSE"], "system_overlap": "LOW_TO_MEDIUM", "body": "목적: 시장은 싫어하지만 사업이 개선되는 후보 찾기\n\n정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\nUniverse는 `{{universe}}`, 최대 후보 수는 `{{candidate_count}}`, 기존 시스템 후보는 `{{existing_system_candidates}}`다. 결과는 매수 추천이 아니라 다음 QGV/Technical/Macro 분석으로 보낼 Research Candidate다. 기존 후보를 반복할 때는 새로운 비정형 Evidence가 있을 때만 포함해.\n\n조사 초점: {{system_summary}}에서 약한 시장평가와 개선되는 운영 Evidence가 동시에 존재하는지 확인하고 Turnaround와 Value Trap을 구분한다.\n\n출력:\n1. 후보와 부정적 시장판단\n2. 사업 개선 Evidence\n3. Catalyst/시간축\n4. Value Trap Evidence\n5. 후보 유지 조건\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "universe", "required": true, "kind": "TEXT", "owner": null, "hint": "어떤 종목 집합에서 조사 후보를 찾을지 정합니다. 국가·시장·선정 기준·기준일을 명확히 씁니다.", "guide": {"label": {"ko-KR": "후보 탐색 범위", "en-US": "Candidate search universe"}, "description": {"ko-KR": "어떤 종목 집합에서 조사 후보를 찾을지 정합니다. 국가·시장·선정 기준·기준일을 명확히 씁니다.", "en-US": "Define the companies to search, stating the country, market, selection rule and relevant date."}, "placeholder": {"ko-KR": "예: 미국 시총 상위 500개 종목 · 기준일 2026-10-09", "en-US": "Example: the 500 largest US companies by market cap, as of 2026-10-09"}, "source": {"ko-KR": "직접 정한 조사 범위 또는 이미 확인한 Universe 목록에서 가져옵니다.", "en-US": "Use your research scope or an already verified universe list."}}}, {"name": "candidate_count", "required": true, "kind": "POSITIVE_INT", "owner": null, "hint": "최대 후보 수 (양의 정수)", "guide": {"label": {"ko-KR": "최대 후보 수", "en-US": "Maximum candidate count"}, "description": {"ko-KR": "출력할 Research Candidate 수의 상한입니다. 양의 정수로 입력하며 부족한 후보를 억지로 채우지 않습니다.", "en-US": "A positive-integer upper limit for research candidates. It does not require inventing candidates to meet the limit."}, "placeholder": {"ko-KR": "예: 10", "en-US": "Example: 10"}, "source": {"ko-KR": "한 번에 검토할 수 있는 최대 후보 수를 직접 정합니다.", "en-US": "Choose the maximum number of candidates you can review."}}}, {"name": "as_of", "required": true, "kind": "DATE", "owner": null, "hint": "정보 cutoff (PIT). YYYY-MM-DD", "guide": {"label": {"ko-KR": "정보 기준일", "en-US": "Information cutoff"}, "description": {"ko-KR": "이 시점까지 공개·이용 가능했던 정보만 사용합니다. 미래 날짜는 허용되지 않습니다.", "en-U n actual existing integrated assessment from the Today screen only when available. Otherwise state that data is unavailable; do not synthesize a new integrated assessment from individual results."}}}]}, {"prompt_id": "plv1.idea.020", "prompt_code": "IDEA-020.v1.0", "title": "시스템·Consensus가 놓친 후보 찾기", "purpose": "{{system_coverage_summary}}의 Coverage Gap, 작은 세부시장, 비정형 Evidence와 Consensus 부재를 이용하되 단순 저유동성·데이터 부족을 강점으로 오인하지 않는다.", "domain": "DISCOVERY", "role": "BLIND-SPOT", "category": "RESEARCH_CANDIDATE_DISCOVERY", "subcategory": "CONTRARIAN_BLIND_SPOT", "tags": ["discovery", "blind-spot", "contrarian_blind_spot"], "keywords": ["시스템", "Consensus가", "놓친", "후보", "찾기"], "aliases": ["시스템/Consensus가 아직 잘 보지 않는 후보 찾기"], "scopes": ["UNIVERSE"], "system_overlap": "LOW_TO_MEDIUM", "body": "목적: 시스템·Consensus가 놓친 후보 찾기\n\n정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\nUniverse는 `{{universe}}`, 최대 후보 수는 `{{candidate_count}}`, 기존 시스템 후보는 `{{existing_system_candidates}}`다. 결과는 매수 추천이 아니라 다음 QGV/Technical/Macro 분석으로 보낼 Research Candidate다. 기존 후보를 반복할 때는 새로운 비정형 Evidence가 있을 때만 포함해.\n\n조사 초점: {{system_coverage_summary}}의 Coverage Gap, 작은 세부시장, 비정형 Evidence와 Consensus 부재를 이용하되 단순 저유동성·데이터 부족을 강점으로 오인하지 않는다.\n\n출력:\n1. 미포착 후보\n2. 왜 시스템 밖인지\n3. 새 Evidence\n4. 데이터 공백/유동성 위험\n5. Research Candidate 등록 조건\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "universe", "required": true, "kind": "TEXT", "owner": null, "hint": "어떤 종목 집합에서 조사 후보를 찾을지 정합니다. 국가·시장·선정 기준·기준일을 명확히 씁니다.", "guide": {"label": {"ko-KR": "후보 탐색 범위", "en-US": "Candidate search universe"}, "description": {"ko-KR": "어떤 종목 집합에서 조사 후보를 찾을지 정합니다. 국가·시장·선정 기준·기준일을 명확히 씁니다.", "en-US": "Define the companies to search, stating the country, market, selection rule and relevant date."}, "placeholder": {"ko-KR": "예: 미국 시총 상위 500개 종목 · 기준일 2026-10-09", "en-US": "Example: the 500 largest US companies by market cap, as of 2026-10-09"}, "source": {"ko-KR": "직접 정한 조사 범위 또는 이미 확인한 Universe 목록에서 가져옵니다.", "en-US": "Use your research scope or an already verified universe list."}}}, {"name": "candidate_count", "required": true, "kind": "POSITIVE_INT", "owner": null, "hint": "최대 후보 수 (양의 정수)", "guide": {"label": {"ko-KR": "최대 후보 수", "en-US": "Maximum candidate count"}, "description": {"ko-KR": "출력할 Research Candidate 수의 상한입니다. 양의 정수로 입력하며 부족한 후보를 억지로 채우지 않습니다.", "en-US": "A positive-integer upper limit for research candidates. It does not require inventing candidates to meet the limit."}, "placeholder": {"ko-KR": "예: 10", "en-US": "Example: 10"}, "source": {"ko-KR": "한 번에 검토할 수 있는 최대 후보 수를 직접 정합니다.", "en-US": "Choose the maximum number of candidates you can review."}}}, {"name": "as_of", "required": true, "kind": "DATE", "owner": null, "hint": "정보 cutoff (PIT). YYYY-MM-DD", "guide": {"label": {"ko-KR": "정보 기준일", "en-US": "Information cutoff"}, "description": {"ko-KR": "이 시점까지 공개·이용 가능했던 정보만 사용합니다. 미래 날짜는 허용되지 않습니다.", "en-US": "Use only information publicly available by this cutoff. Future cutoffs are not allowed."}, "placeholder": {"ko-KR": "예: 2026-10-09", "en-US": "Example: 2026-10-09"}, "source": {"ko-KR": "이번 분석에 사용할 정보 기준일을 직접 정합니다.", "en-US": "Choose the information cutoff for this analysis."}}}, {"name": "existing_system_candidates", "required": true, "kind": "TEXT", "owner": "QGV_LEADERBOARD", "hint": "기존 QGV 리더보드 후보와 비교하여 중복·빠진 후보를 조사합니다. 새 공식 후보 목록이나 점수를 입력하는 필드가 아닙니다.", "guide": {"label": {"ko-KR": "기존 시스템 후보 목록", "en-US": "Existing system candidates"}, "description": {"ko-KR": "기존 QGV 리더보드 후보와 비교하여 중복·빠진 후보를 조사합니다. 새 공식 후보 목록이나 점수를 입력하는 필드가 아닙니다.", "en-US": "Existing QGV leaderboard candidates used to identify overlaps or gaps, not a new official candidate list or _CONTROLLED", "body": "목적: 사업모델과 경제적 엔진 이해하기\n\n분석 대상은 `{{company}}`(`{{ticker}}`)다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n기존 QGV 요약은 `{{qgv_snapshot_summary}}`다. 이를 재계산하거나 새로운 Q/G/V 점수로 대체하지 말고, 시스템이 아직 갖지 못한 외부·비정형·반대 Evidence를 조사해. 요약이 비어 있어도 독자 QGV 점수를 만들지 마.\n\n조사 초점: {{company}}({{ticker}})의 고객, 지불 주체, 가격결정, 비용구조, 반복성, 단위경제와 Value Chain 위치를 설명하되 QGV 점수를 다시 계산하지 않는다.\n\n출력:\n1. 수익 창출 구조\n2. 고객/지불 주체\n3. Unit Economics\n4. 확장 제약\n5. 검증할 원자료\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "company", "required": true, "kind": "TEXT", "owner": null, "hint": "이번 분석의 대상 회사 이름입니다. 종목 코드와 같은 회사를 가리켜야 합니다.", "guide": {"label": {"ko-KR": "분석할 회사", "en-US": "Company to analyze"}, "description": {"ko-KR": "이번 분석의 대상 회사 이름입니다. 종목 코드와 같은 회사를 가리켜야 합니다.", "en-US": "The company being analyzed. Its name and ticker must identify the same company."}, "placeholder": {"ko-KR": "예: NVIDIA", "en-US": "Example: NVIDIA"}, "source": {"ko-KR": "회사 공시·공식 홈페이지 또는 확인한 기업 정보에서 가져옵니다.", "en-US": "Use company filings, its official website or verified company information."}}}, {"name": "ticker", "required": true, "kind": "TEXT", "owner": null, "hint": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "guide": {"label": {"ko-KR": "종목 코드", "en-US": "Ticker"}, "description": {"ko-KR": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "en-US": "Enter the ticker being analyzed, distinguishing listings on different exchanges when needed."}, "placeholder": {"ko-KR": "예: NVDA", "en-US": "Example: NVDA"}, "source": {"ko-KR": "기업의 공식 상장 정보 또는 확인한 종목 식별 정보에서 가져옵니다.", "en-US": "Use verified listing information or the company's official listing details."}}}, {"name" r}}`)다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n기존 QGV 요약은 `{{qgv_snapshot_summary}}`다. 이를 재계산하거나 새로운 Q/G/V 점수로 대체하지 말고, 시스템이 아직 갖지 못한 외부·비정형·반대 Evidence를 조사해. 요약이 비어 있어도 독자 QGV 점수를 만들지 마.\n\n조사 초점: {{company}}({{ticker}})와 직접 경쟁사·간접 대체재를 동일 세부시장 기준으로 비교하고 시장점유율·기술·가격·채널의 출처 차이를 확인한다.\n\n출력:\n1. 동일 기준 Peer Set\n2. 직접 비교표\n3. 우위/열위 Evidence\n4. 비교 불가능 항목\n5. QGV에 없는 새 정보\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "company", "required": true, "kind": "TEXT", "owner": null, "hint": "이번 분석의 대상 회사 이름입니다. 종목 코드와 같은 회사를 가리켜야 합니다.", "guide": {"label": {"ko-KR": "분석할 회사", "en-US": "Company to analyze"}, "description": {"ko-KR": "이번 분석의 대상 회사 이름입니다. 종목 코드와 같은 회사를 가리켜야 합니다.", "en-US": "The company being analyzed. Its name and ticker must identify the same company."}, "placeholder": {"ko-KR": "예: NVIDIA", "en-US": "Example: NVIDIA"}, "source": {"ko-KR": "회사 공시·공식 홈페이지 또는 확인한 기업 정보에서 가져옵니다.", "en-US": "Use company filings, its official website or verified company information."}}}, {"name": "ticker", "required": true, "kind": "TEXT", "owner": null, "hint": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "guide": {"label": {"ko-KR": "종목 코드", "en-US": "Ticker"}, "description": {"ko-KR": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "en-US": "Enter the ticker being analyzed, distinguishing listings on different exchanges when needed."}, "placeholder": {"ko-KR": "예: NVDA", "en-US": "Example: NVDA"}, "source": {"ko-KR": "기업의 공식 상장 정보 또는 확인한 종목 식별 정보에서 가져옵니다.", "en-US": "Use verified listing information or the company's official listing details."}}}, {"name": "as_of", "required": true, "kind": "DATE", "owner": null, "hint": "정보 cutoff iod}}의 PIT OHLCV, 조정/비조정 기준, 거래소 시간대, Corporate Action과 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{technical_input}}의 Trend·Momentum·Volume/Flow·Relative Strength·Structure·Volatility·Support/Resistance를 함께 해석하고 Corporate Action·결측·시간대·조정가격 오류를 먼저 점검한다.\n\n출력:\n1. Input/Data Quality\n2. Technical State\n3. 상충 Signal\n4. Scenario/Confirmation\n5. Invalidation/추가 데이터\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"name": "ticker", "required": true, "kind": "TEXT", "owner": null, "hint": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "guide": {"label": {"ko-KR": "종목 코드", "en-US": "Ticker"}, "description": {"ko-KR": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "en-US": "Enter the ticker being analyzed, distinguishing listings on different exchanges when needed."}, "placeholder": {"ko-KR": "예: NVDA", "en-US": "Example: NVDA"}, "source": {"ko-KR": "기업의 공식 상장 정보 또는 확인한 종목 식별 정보에서 가져옵니다.", "en-US": "Use verified listing information or the company's official listing details."}}}, {"name": "period", "required": true, "kind": "TEXT", "owner": null, "hint": "기술적 분석에 제공할 가격·거래량 자료의 기간입니다. 정보 기준일까지의 실제 자료와 맞춥니다.", "guide": {"label": {"ko-KR": "가격·차트 분석 기간", "en-US": "Price and chart analysis period"}, "description": {"ko-KR": "기술적 분석에 제공할 가격·거래량 자료의 기간입니다. 정보 기준일까지의 실제 자료와 맞춥니다.", "en-US": "The period covered by price and volume data supplied for technical analysis, ending no later than the cutoff."}, "placeholder": {"ko-KR": "예: 최근 1년 · 2025-10-09~2026-10-09", "en-US": "Example: the last year, 2025-10-09 to 2026-10-09"}, "source": {"ko-KR": "보유한 차트·OHLCV 자료 또는 기존 TechnicalSnapshot의 기간에서 확인합니다.", "en-US": "Read it from supplied OHLCV data or the existing technical snapshot."}}}, {"name": "as_of", "required": true, "kind": "DATE", "owner": null, "hint": "정보 cutoff (PIT). YYYY-MM-DD", "guide": {"label": {"ko-KR": "정보 기준일", "en-US": "Information cutoff"}, "description": {"ko-KR": "이 시점까지 공개·이용 가능했던 정보만 사용합니다. 미래 날짜는 허용되지 않습니다.", "en-US": "Use only information publicly available by this cutoff. Future cutoffs are not allowed."}, "placeholder": {"ko-KR": "예: 2026-10-09", "en-US": "Example: 2026-10-09"}, "source": {"ko-KR": "이번 분석에 사용할 정보 기준일을 직접 정합니다.", "en-US": "Choose the information cutoff for this analysis."}}}, {"name": "technical_input", "required": true, "kind": "TEXT", "owner": "TECHNICAL", "hint": "SYSTEM_CONTEXT는 기존 기술 Snapshot·계산 결과를 재계산 없이 사용합니다. STANDALONE은 실제 PIT OHLCV·조정 기준·시간대·기업행사·출처가 필요하며 없으면 INSUFFICIENT_DATA입니다.", "guide": {"label": {"ko-KR": "기술 분석 입력 자료", "en-US": "Technical analysis input"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 기술 Snapshot·계산 결과를 재계산 없이 사용합니다. STANDALONE은 실제 PIT OHLCV·조정 기준·시간대·기업행사·출처가 필요하며 없으면 INSUFFICIENT_DATA입니다.", "en-US": "SYSTEM_CONTEXT consumes existing technical sn rporate Action 기준으로 맞춰 절대수익률과 상대강도의 개선을 구분한다.", "domain": "TECHNICAL", "role": "EXPAND", "category": "TECHNICAL_EVIDENCE_EXTENSION", "subcategory": "STATE_AND_STRUCTURE", "tags": ["technical", "expand", "state_and_structure"], "keywords": ["Relative", "Strength", "변화", "검증"], "aliases": ["Relative Strength 변화 분석"], "scopes": ["COMPANY"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: Relative Strength 변화 검증\n\n분석 대상 Ticker는 `{{ticker}}`, 기간은 `{{period}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{technical_input}}`의 기존 TechnicalSnapshot/계산 결과를 사실로 받아들이고 지표를 다시 계산하거나 새 점수를 만들지 마. STANDALONE이면 `{{technical_input}}`에 {{period}}의 PIT OHLCV, 조정/비조정 기준, 거래소 시간대, Corporate Action과 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{technical_input}}와 {{benchmark_or_peers}}를 동일 기간·통화·Corporate Action 기준으로 맞춰 절대수익률과 상대강도의 개선을 구분한다.\n\n출력:\n1. 비교 기준\n2. RS 추세\n3. Peer/Market 분해\n4. Divergence\n5. 지속/무효화 조건\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYST 서 가져옵니다.", "en-US": "Use verified benchmarks or peers with actual price data on a comparable basis."}}}]}, {"prompt_id": "plv1.tech.010", "prompt_code": "TECH-010.v1.0", "title": "거래량·Flow 변화의 의미 검증", "purpose": "{{technical_input}}의 거래량을 가격 위치, Gap, Event, 평균 대비, 누적/분배 맥락에서 해석하고 단순 거래량 급증을 매수신호로 취급하지 않는다.", "domain": "TECHNICAL", "role": "EXPAND", "category": "TECHNICAL_EVIDENCE_EXTENSION", "subcategory": "STATE_AND_STRUCTURE", "tags": ["technical", "expand", "state_and_structure"], "keywords": ["거래량", "Flow", "변화의", "의미", "검증"], "aliases": ["거래량 변화의 의미 분석"], "scopes": ["COMPANY"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: 거래량·Flow 변화의 의미 검증\n\n분석 대상 Ticker는 `{{ticker}}`, 기간은 `{{period}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{technical_input}}`의 기존 TechnicalSnapshot/계산 결과를 사실로 받아들이고 지표를 다시 계산하거나 새 점수를 만들지 마. STANDALONE이면 `{{technical_input}}`에 {{period}}의 PIT OHLCV, 조정/비조정 기준, 거래소 시간대, Corporate Action과 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{technical_input}}의 거래량을 가격 위치, Gap, Event, 평균 대비, 누적/분배 맥락에서 해석하고 단순 거래량 급증을 매수신호로 취급하지 않는다.\n\n출력:\n1. Volume 이상\n2. 가격과 결합 의미\n3. Event 연결\n4. 반대 해석\n5. 확인 조건\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"name": "ticker", "required": true, "kind": "TEXT", "owner": null, "hint": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "guide": {"label": {"ko-KR": "종목 코드", "en-US": "Ticker"}, "description": {"ko-KR": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "en-US": "Enter the ticker being analyzed, distinguishing listings on different exchanges when needed."}, "placeholder": {"ko-KR": "예: NVDA", "en-US": "Example: NVDA"}, "source": {"ko-KR": "기업의 공식 상장 정보 또는 확인한 종목 식별 정보에서 가져옵니다.", "en-US": "Use verified listing information or the company's official listing details."}}}, {"name": "period", "required": true, "kind": "TEXT", "owner": null, "hint": "기술적 분석에 제공할 가격·거래량 자료의 기간입니다. 정보 기준일까지의 실제 자료와 맞춥니다.", "guide": {"label": {"ko-KR": "가격·차트 분석 기간", "en-US": "Price and chart analysis period"}, "description": {"ko-KR": "기술적 분석에 제공할 가격·거래량 자료의 기간입니다. 정보 기준일까지의 실제 자료와 맞춥니다.", "en-US": "The period covered by price and volume data supplied for technical analysis, ending no later than the cutoff."}, "placeholder": {"ko-KR": "예: 최근 1년 · 2025-10-09~2026-10-09", "en-US": "Example: the last year, 2025-10-09 to 2026-10-09"}, "source": {"ko-KR": "보유한 차트·OHLCV 자료 또는 기존 TechnicalSnapshot의 기간에서 확인합니다.", "en-US": "Read it from supplied OHLCV data or the existing technical snapshot."}}}, {"name": "as_of", "required": true, "kind": "DATE", "owner": null, "hint": "정보 cutoff (PIT). YYYY-MM-DD", "guide": {"label": {"ko-KR": "정보 기준일", "en-US": "Information cutoff"}, "description": {"ko-KR": "이 시점까지 공개·이용 가  ["Volatility Regime 변화 분석"], "scopes": ["COMPANY"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: Volatility Regime 변화 분석\n\n분석 대상 Ticker는 `{{ticker}}`, 기간은 `{{period}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{technical_input}}`의 기존 TechnicalSnapshot/계산 결과를 사실로 받아들이고 지표를 다시 계산하거나 새 점수를 만들지 마. STANDALONE이면 `{{technical_input}}`에 {{period}}의 PIT OHLCV, 조정/비조정 기준, 거래소 시간대, Corporate Action과 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{technical_input}}에서 실현변동성, ATR, Gap, Tail, Range 변화가 Trend 강화인지 불안정성 확대인지 구분하고 Regime 전환을 검증한다.\n\n출력:\n1. Volatility State\n2. Regime 변화 Evidence\n3. Trend와 관계\n4. Risk Range\n5. 전환 Invalidation\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"na  2026-09-10; add original sources and release times"}, "source": {"ko-KR": "확인한 공시·공식 발표·뉴스 원문에서 가져오고 사실과 해석을 구분합니다.", "en-US": "Use verified filings, official announcements or original news, separating facts from interpretations."}}}]}, {"prompt_id": "plv1.tech.020", "prompt_code": "TECH-020.v1.0", "title": "기업·산업·Macro 가격 움직임 분해", "purpose": "{{technical_input}}과 {{benchmark_or_peers}}를 이용해 기업 고유, 산업 공통, 시장/Macro 요인을 분리하되 회귀계수를 임의 생성하지 않는다.", "domain": "TECHNICAL", "role": "BLIND-SPOT", "category": "TECHNICAL_EVIDENCE_EXTENSION", "subcategory": "CATALYST_AND_DIVERGENCE", "tags": ["technical", "blind-spot", "catalyst_and_divergence"], "keywords": ["기업", "산업", "Macro", "가격", "움직임", "분해"], "aliases": ["기업 vs 산업 vs Macro 움직임 분해"], "scopes": ["COMPANY"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: 기업·산업·Macro 가격 움직임 분해\n\n분석 대상 Ticker는 `{{ticker}}`, 기간은 `{{period}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{technical_input}}`의 기존 TechnicalSnapshot/계산 결과를 사실로 받아들이고 지표를 다시 계산하거나 새 점수를 만들지 마. STANDALONE이면 `{{technical_input}}`에 {{period}}의 PIT OHLCV, 조정/비조정 기준, 거래소 시간대, Corporate Action과 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{technical_input}}과 {{benchmark_or_peers}}를 이용해 기업 고유, 산업 공통, 시장/Macro 요인을 분리하되 회귀계수를 임의 생성하지 않는다.\n\n출력:\n1. 가격 움직임 구간\n2. 기업/산업/시장 Evidence\n3. 설명 비중의 한계\n4. 고유 잔차\n5. 추가 데이터\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식"  확인 Event\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"name": "ticker", "required": true, "kind": "TEXT", "owner": null, "hint": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "guide": {"label": {"ko-KR": "종목 코드", "en-US": "Ticker"}, "description": {"ko-KR": "이번에 분석할 종목의 코드를 입력합니다. 같은 코드의 다른 거래소 종목과 구분합니다.", "en-US": "Enter the ticker being analyzed, distinguishing listings on different exchanges when needed."}, "placeholder": {"ko-KR": "예: NVDA", "en-US": "Example: NVDA"}, "source": {"ko-KR": "기업의 공식 상장 정보 또는 확인한 종목 식별 정보에서 가져옵니다.", "en-US": "Use verified listing information or the company's official listing details."}}}, {"name": "period", "required": true, "kind": "TEXT", "owner": null, "hint": "기술적 분석에 제공할 가격·거래량 자료의 기간입니다. 정보 기준일까지의 실제 자료와 맞춥니다.", "guide": {" ICAL 결과가 있을 때만 복사하거나 STANDALONE용 실제 시점별 원자료를 제공합니다. 없으면 미제공을 명시합니다. 준비 화면은 자동 데이터 연결이 아닙니다.", "en-US": "Copy actual TECHNICAL results from the Technical screen only when available, or supply real point-in-time data for STANDALONE. Otherwise state that data is unavailable. A preparation screen does not imply connected data."}}}, {"name": "news_event_evidence", "required": true, "kind": "TEXT", "owner": null, "hint": "가격 움직임과 비교할 실적·정책 등 사건의 실제 근거입니다. 공개 시점·이용 가능 시점·원문을 함께 씁니다.", "guide": {"label": {"ko-KR": "시간순 뉴스·이벤트 근거", "en-US": "Dated news and event evidence"}, "description": {"ko-KR": "가격 움직임과 비교할 실적·정책 등 사건의 실제 근거입니다. 공개 시점·이용 가능 시점·원문을 함께 씁니다.", "en-US": "Actual earnings, policy or other event evidence to compare with price moves, including release time, availability time and original sources."}, "placeholder": {"ko-KR": "가상 예: 2026-08-27 실적 발표; 2026-09-10 수출 규제 발표 · 원문과 공개 시각 추가", "en-US": "Illustrative events: earnings release on 2026-08-27; export restrictions announcement on 2026-09-10; add original sources and release times"}, "source": {"ko-KR": "확인한 공시·공식 발표·뉴스 원문에서 가져오고 사실과 해석을 구분합니다.", "en-US": "Use verified filings, official announcements or original news, separating facts from interpretations."}}}]}, {"prompt_id": "plv1.tech.023", "prompt_code": "TECH-023.v1.0", "title": "Options·Positioning 보조신호 조사", "purpose": "{{options_positioning_data}}를 {{technical_input}}과 함께 보되 IV, Skew, Open Interest, Dealer/Flow 추정을 사실과 분리하고 데이터가 없으면 결론내리지 않는다.", "domain": "TECHNICAL", "role": "BLIND-SPOT", "category": "TECHNICAL_EVIDENCE_EXTENSION", "subcategory": "CATALYST_AND_DIVERGENCE", "tags": ["technical", "blind-spot", "catalyst_and_divergence"], "keywords": ["Options", "Positioning", "보조신호", "조사"], "aliases": ["Options/Positioning의 다른 신호 조사"], "scopes": ["COMPANY"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: Options·Positioning 보조신호 조사\n\n분석 대상 Ticker는 `{{ticker}}`, 기간은 `{{period}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{i 가 있을 때만 복사하거나 STANDALONE용 확인된 원자료를 제공합니다. 없으면 미제공을 명시합니다. 8축 준비 표시가 데이터 제공 완료를 뜻하지 않습니다.", "en-US": "Copy actual MACRO results from the Macro screen only when available, or provide verified source data for STANDALONE. Otherwise state that data is unavailable. An eight-axis preparation display does not mean data is available."}}}]}, {"prompt_id": "plv1.macro.009", "prompt_code": "MACRO-009.v1.0", "title": "시장 금리경로와 오류 가능성 검증", "purpose": "{{macro_input}}의 정책금리·국채곡선·Real Yield·Inflation Expectation을 비교해 시장의 {{rate_path_assumption}}과 이를 틀리게 만들 Evidence를 함께 조사한다.", "domain": "MACRO", "role": "EXPAND", "category": "MACRO_EVIDENCE_EXTENSION", "subcategory": "STATE_AND_DRIVERS", "tags": ["macro", "expand", "state_and_drivers"], "keywords": ["시장", "금리경로와", "오류", "가능성", "검증"], "aliases": ["시장이 기대하는 금리경로 조사", "MACRO-017", "plv1.macro.017", "시장 금리기대가 틀릴 가능성 검증"], "scopes": ["MARKET"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: 시장 금리경로와 오류 가능성 검증\n\n분석 시장은 `{{market}}`, Horizon은 `{{horizon}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{macro_input}}`의 기존 MacroSnapshot, State/Regime을 재계산하거나 덮어쓰지 말고 Delta Evidence와 Divergence만 조사해. STANDALONE이면 `{{macro_input}}`에 {{market}}·{{horizon}}에 필요한 PIT release/vintage/market-implied data와 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{macro_input}}의 정책금리·국채곡선·Real Yield·Inflation Expectation을 비교해 시장의 {{rate_path_assumption}}과 이를 틀리게 만들 Evidence를 함께 조사한다.\n\n출력:\n1. 시장 내재 경로\n2. 정책/데이터 Evidence\n3. 기대 불일치\n4. 오류 Scenario\n5. 재평가 Trigger\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPU : "시장 금리경로 가정", "en-US": "Market rate-path assumption"}, "description": {"ko-KR": "시장에 내재한 금리경로 중 검증할 가정입니다. 기준 시점·기간·근거와 이를 틀리게 할 조건을 함께 씁니다.", "en-US": "The market-implied rate path to challenge, including its date, horizon, evidence and conditions that could invalidate it."}, "placeholder": {"ko-KR": "예: 향후 금리 인하를 예상하는 시장 가정 · 기준일과 근거 추가", "en-US": "Example: a market assumption of future rate cuts; add the cutoff and evidence"}, "source": {"ko-KR": "확인한 시장 내재 자료·기존 분석에서 가져옵니다. 미래 금리경로를 사실처럼 만들지 않습니다.", "en-US": "Use verified market-implied data or an existing analysis; do not invent a future path as fact."}}}]}, {"prompt_id": "plv1.macro.010", "prompt_code": "MACRO-010.v1.0", "title": "Liquidity 변화 Driver 조사", "purpose": "{{macro_input}}에서 중앙은행 Balance Sheet, Treasury Cash, Bank Credit, Funding, Dollar, Cross-border Flow를 구분해 Liquidity 변화와 위험자산 전달경로를 조사한다.", "domain": "MACRO", "role": "EXPAND", "category": "MACRO_EVIDENCE_EXTENSION", "subcategory": "STATE_AND_DRIVERS", "tags": ["macro", "expand", "state_and_drivers"], "keywords": ["Liquidity", "변화", "Driver", "조사"], "aliases": ["Liquidity 변화 원인 조사"], "scopes": ["MARKET"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: Liquidity 변화 Driver 조사\n\n분석 시장은 `{{market}}`, Horizon은 `{{horizon}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{macro_input}}`의 기존 MacroSnapshot, State/Regime을 재계산하거나 덮어쓰지 말고 Delta Evidence와 Divergence만 조사해. STANDALONE이면 `{{macro_input}}`에 {{market}}·{{horizon}}에 필요한 PIT release/vintage/market-implied data와 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{macro_input}}에서 중앙은행 Balance Sheet, Treasury Cash, Bank Credit, Funding, Dollar, Cross-border Flow를 구분해 Liquidity 변화와 위험자산 전달경로를 조사한다.\n\n출력:\n1. Liquidity 구성요소\n2. 순방향/역방향 Driver\n3. 전달경로\n4. 시차\n5. 반대 Evidence\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"name": "market", "required": true, "kind": "TEXT", "owner": null, "hint": "거시 변화와 전달 경로를 조사할 국가·시장 범위입니다.", "guide": {"label": {"ko-KR": "거시 분석 시장", "en-US": "Market for macro analysis"}, "description": {"ko-KR": "거시 변화와 전달 경로를 조사할 국가·시장 범위입니다.", "en-US": "The country or market whose macro conditions and transmission paths will be researched."}, "placeholder": {"ko-KR": "예: 미국", "en-US": "Example: United States"}, "source": {"ko-KR": "이번 거시 질문의 대상 시장을 직접 정합니다.", "en-US": "Choose the market relevant to the macro question."}}}, {"name": "horizon", "required": true, "kind": "TEXT", "owner": null, "hint": "거시 시나리오·영향을 검토할 기간입니다. 과거 가격 자료의 기간인 period와 구분합니다.", "guide": {"label": {"ko-KR": "거시 판단 기간", "en-US": "Macro analysis horizon"}, "description": {"ko-KR": "거시 시나리오·영향을 검토할 기간입니다. 과거 가격 자료의 기간인 period와 구분합니다.", "en-US": "The horizon for macro scenarios and impacts, distin ment"}, "source": {"ko-KR": "확인한 산업 분류 또는 직접 정한 조사 범위에서 가져옵니다.", "en-US": "Use a verified industry classification or your defined research scope."}}}]}, {"prompt_id": "plv1.macro.012", "prompt_code": "MACRO-012.v1.0", "title": "Macro→기업 Earnings Transmission 분석", "purpose": "{{macro_input}}의 Shock이 {{company}}({{ticker}})의 Revenue, Margin, FCF, Discount Rate에 전달되는 경로를 QGV Base와 분리해 분석한다.", "domain": "MACRO", "role": "EXPAND", "category": "MACRO_EVIDENCE_EXTENSION", "subcategory": "TRANSMISSION_AND_RISK", "tags": ["macro", "expand", "transmission_and_risk"], "keywords": ["Macro", "기업", "Earnings", "Transmission", "분석"], "aliases": ["Macro 변화가 특정 기업 실적으로 전달되는 과정"], "scopes": ["COMPANY", "MARKET"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: Macro→기업 Earnings Transmission 분석\n\n분석 시장은 `{{market}}`, Horizon은 `{{horizon}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{macro_input}}`의 기존 MacroSnapshot, State/Regime을 재계산하거나 덮어쓰지 말고 Delta Evidence와 Divergence만 조사해. STANDALONE이면 `{{macro_input}}`에 {{market}}·{{horizon}}에 필요한 PIT release/vintage/market-implied data와 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{macro_input}}의 Shock이 {{company}}({{ticker}})의 Revenue, Margin, FCF, Discount Rate에 전달되는 경로를 QGV Base와 분리해 분석한다.\n\n출력:\n1. Shock와 기업 노출\n2. Earnings Bridge\n3. Exposure vs Sensitivity\n4. Lag·Duration\n5. 반대/완충 Evidence\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko- _DATA`로 종료해.\n\n조사 초점: {{macro_input}}과 {{scenario_assumptions}}에서 현재 Regime 및 Soft Landing/Recession 가정을 반박할 가장 강한 Evidence를 양방향으로 검증한다.\n\n출력:\n1. 기준 Scenario\n2. 지지 Evidence\n3. 반대 Evidence\n4. 확률을 바꿀 Data\n5. Invalidation\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공개일/시간, 해당 정보가 이용 가능해진 시점, 원문 근거를 표시해.\n- Fact / Interpretation / Estimate / Scenario를 분리하고 Source 간 충돌은 양쪽을 보존해.\n- 확인할 수 없는 수치·관계·가격·지표·확률은 만들지 말고 `UNKNOWN` 또는 `INSUFFICIENT_DATA`로 표시해.\n- 기존 Investment System의 정형 분석을 외부 AI가 그대로 다시 계산하지 마.\n- BUY/SELL/HOLD나 최종 투자결정을 대신하지 말고 다음 Research 조건과 판단 변경 조건만 제시해.", "variables": [{"name": "input_mode", "required": true, "kind": "INPUT_MODE", "owner": null, "hint": "SYSTEM_CONTEXT (기존 Snapshot 소비, 재계산 금지) | STANDALONE (PIT 데이터 직접 제공, 없으면 INSUFFICIENT_DATA)", "guide": {"label": {"ko-KR": "자료 입력 방식", "en-US": "Input mode"}, "description": {"ko-KR": "SYSTEM_CONTEXT는 기존 시스템 결과를 받아 재계산하지 않습니다. STANDALONE도 질문만으로 충분하지 않으며 기술·거시 실제 PIT 원자료가 없으면 INSUFFICIENT_DATA로 종료합니다.", "en-US": "SYSTEM_CONTEXT consumes existing system results without recalculation. STANDALONE still needs actual technical or macro PIT data; a question alone is insufficient and missing data ends in INSUFFICIENT_DATA."}, "placeholder": {"ko-KR": "SYSTEM_CONTEXT 또는 STANDALONE을 선택", "en-US": "Choose SYSTEM_CONTEXT or STANDALONE"}, "source": {"ko-KR": "사용자가 직접 선택합니다. 선택만으로 Snapshot이나 원자료를 자동으로 가져오지 않습니다.", "en-US": "Select it yourself; choosing a mode does not automatically fetch snapshots or source data."}}}, {"name": "market", "required": true, "kind": "TEXT", "owner": null, "hint": "거시 변화와 전달 경로를 조사할 국가·시장 범위입니다.", "guide": {"label": {"ko-KR": "거시 분석 시장", "en-US": "Market for macro analysis"}, "description": {"ko-KR": "거시 변화와 전달 경로를 조사할 국가·시장 범위입니다.", "en-US": "The country or market whose macro conditions and transmission paths will be researched."}, "placeholder": {"ko-KR": "예: 미국", "en-US": "Example: United States"}, "source": {"ko-KR": "이번 거시 질문의 대상 시장을 직접 정합니다.", "en-US": "Choose the market relevant to  Macro screen only when available, or provide verified source data for STANDALONE. Otherwise state that data is unavailable. An eight-axis preparation display does not mean data is available."}}}, {"name": "prior_cutoff", "required": true, "kind": "DATE", "owner": null, "hint": "이전 분석 cutoff. YYYY-MM-DD, as_of보다 이전", "guide": {"label": {"ko-KR": "이전 분석 기준일", "en-US": "Previous analysis cutoff"}, "description": {"ko-KR": "이전 분석 이후 새로 공개된 정보를 비교할 시작 기준일입니다. 이번 정보 기준일보다 앞서야 합니다.", "en-US": "The earlier analysis cutoff used to identify newly available information. It must precede the current cutoff."}, "placeholder": {"ko-KR": "예: 2026-07-01", "en-US": "Example: 2026-07-01"}, "source": {"ko-KR": "비교할 이전 분석·Snapshot의 기준일에서 확인합니다.", "en-US": "Read the cutoff from the earlier analysis or snapshot."}}}]}, {"prompt_id": "plv1.macro.020", "prompt_code": "MACRO-020.v1.0", "title": "해외발 미국시장 위험 조사", "purpose": "{{macro_input}}에 없는 해외 Growth, FX, Commodity, Geopolitics, Trade, Funding Shock이 미국 산업·시장으로 전염되는 경로를 조사한다.", "domain": "MACRO", "role": "BLIND-SPOT", "category": "MACRO_EVIDENCE_EXTENSION", "subcategory": "TRANSMISSION_AND_RISK", "tags": ["macro", "blind-spot", "transmission_and_risk"], "keywords": ["해외발", "미국시장", "위험", "조사"], "aliases": ["해외에서 발생하는 미국시장 위험 찾기"], "scopes": ["MARKET"], "system_overlap": "HIGH_CONTROLLED", "body": "목적: 해외발 미국시장 위험 조사\n\n분석 시장은 `{{market}}`, Horizon은 `{{horizon}}`다. 정보 cutoff는 `{{as_of}}`다. `{{as_of}}` 시점에 공개·이용 가능했던 정보만 사용해.\n입력 모드 `{{input_mode}}`를 먼저 확인해. SYSTEM_CONTEXT이면 `{{macro_input}}`의 기존 MacroSnapshot, State/Regime을 재계산하거나 덮어쓰지 말고 Delta Evidence와 Divergence만 조사해. STANDALONE이면 `{{macro_input}}`에 {{market}}·{{horizon}}에 필요한 PIT release/vintage/market-implied data와 출처가 있어야 한다. 필요한 데이터가 없으면 `INSUFFICIENT_DATA`로 종료해.\n\n조사 초점: {{macro_input}}에 없는 해외 Growth, FX, Commodity, Geopolitics, Trade, Funding Shock이 미국 산업·시장으로 전염되는 경로를 조사한다.\n\n출력:\n1. 해외 Shock\n2. 미국 전달경로\n3. 노출 산업/기업\n4. 시차/완충\n5. Tail 조건\n\nEvidence 규칙:\n- 핵심 Claim마다 Source, 공 <script>
const DATA = JSON.parse(document.getElementById('plv1-data').textContent);
const MODES = ['SYSTEM_CONTEXT', 'STANDALONE'];
function parseInstant(s){ s=s.trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const d=new Date(s+'T00:00:00+09:00'); return isNaN(d)?null:d; }
  if(!/(Z|[+-]\d{2}:\d{2})$/.test(s)) return null; const d=new Date(s); return isNaN(d)?null:d; }
function plvCheck(p, values, nowIso){ const norm={}, missing=[], invalid=[];
  const unknown=Object.keys(values).filter(k=>!p.variables.some(v=>v.name===k)).sort();
  for(const v of p.variables){ const t=String(values[v.name]==null?'':values[v.name]).trim();
    if(!t){ if(v.required) missing.push(v.name); else norm[v.name]=DATA.not_provided; continue; }
    if(t.includes('{{')||t.includes('}}')){ invalid.push(v.name+': placeholder braces are not allowed in values'); continue; }
    if(v.kind==='DATE' && !parseInstant(t)){ invalid.push(v.name+': not an ISO date (YYYY-MM-DD) or offset-aware ISO datetime'); continue; }
    if(v.kind==='INPUT_MODE' && !MODES.includes(t)){ invalid.push('input_mode: not in SYSTEM_CONTEXT/STANDALONE'); continue; }
    if(v.kind==='POSITIVE_INT' && !(/^\d+$/.test(t) && parseInt(t,10)>0)){ invalid.push(v.name+': not a positive integer'); continue; }
    norm[v.name]=t; }
  if(norm.as_of){ const a=parseInstant(norm.as_of), now=nowIso?new Date(nowIso):new Date();
    if(a>now) invalid.push('as_of: information cutoff lies in the future');
    if(norm.prior_cutoff){ const pc=parseInstant(norm.prior_cutoff); if(!(pc<a)) invalid.push('prior_cutoff: must be strictly before as_of'); } }
  const bad=new Set(invalid.map(s=>s.split(':')[0]));
  const text=p.body.replace(/\{\{([a-z_]+)\}\}/g,(m,n)=>(n in norm && !bad.has(n))?norm[n]:m);
  return {text, missing, invalid, unknown, ready: !(missing.length||invalid.length||unknown.length)}; }
if (typeof module !== 'undefined') { module.exports = { plvCheck, DATA }; }

const byId = Object.fromEntries(DATA.prompts.map(p=>[p.prompt_id,p]));

  today:['오늘 날짜','Today’s date'],modeBlank:['분석 방식을 선택하세요','Choose an analysis mode'],
  SYSTEM_CONTEXT:['SYSTEM_CONTEXT · 시스템 결과 읽기','SYSTEM_CONTEXT · System results'],STANDALONE:['STANDALONE · 자료 직접 제공','STANDALONE · Own data'],
  modeSystem:['SYSTEM_CONTEXT · 시스템 결과 읽기: 기존 결과를 그대로 사용하며 재계산하지 않습니다.','SYSTEM_CONTEXT · Read system results: use existing results without recalculating them.'],
  modeStandalone:['STANDALONE · 자료 직접 제공: 기준 날짜까지 확인한 자료를 직접 붙여넣습니다. 자료가 없으면 INSUFFICIENT_DATA로 종료합니다.','STANDALONE · Provide data yourself: paste evidence available by the cutoff date. Without evidence, stop with INSUFFICIENT_DATA.'],
  missing:['필수 입력입니다. 위 안내에 맞춰 내용을 입력하세요.','Required. Enter a value using the guidance above.'],
  braces:['값에 {{ 또는 }}를 넣지 마세요. 실제 내용을 입력하세요.','Enter actual content without {{ or }} placeholder braces.'],
  date:['YYYY-MM-DD 날짜 또는 시간대가 있는 ISO 시각을 입력하세요.','Enter a YYYY-MM-DD date or an ISO datetime with a timezone.'],
  future:['정보 기준 날짜는 미래일 수 없습니다.','The information cutoff cannot be in the future.'],
  prior:['이전 분석 날짜는 정보 기준 날짜보다 앞서야 합니다.','The prior cutoff must be earlier than the information cutoff.'],
  positive:['1 이상의 정수를 입력하세요.','Enter a positive whole number.'],
  mode:['분석 방식 목록에서 한 가지를 선택하세요.','Choose one of the listed analysis modes.'],
  invalid:['입력 형식을 확인하세요.','Check the value’s format.'],
  QGV:['QGV 결과','QGV results'],QGV_LEADERBOARD:['QGV 후보 목록','QGV candidate list'],
  TECHNICAL:['기술적 분석 결과','Technical results'],MACRO:['매크로 결과','Macro results'],INTEGRATED:['통합 결과','Integrated results']
};
function fieldText(key){return FIELD_COPY[key][fieldLocale==='en-US'?1:0];}
function guideText(v,key){return v.guide[key][fieldLocale];}
function putText(node,value){if(node&&node.textContent!==value)node.textContent=value;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function opts(sel,items,first){ sel.innerHTML='<option value="">'+first+'</option>'+items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(''); }
opts($('#f-domain'),[...new Set(DATA.prompts.map(p=>p.domain))].map(d=>[d,d]),'All domains (전체)');
opts($('#f-role'),['BASIC','EXPAND','CHALLENGE','BLIND-SPOT'].map(r=>[r,r]),'All roles (전체)');
opts($('#f-scope'),['COMPANY','INDUSTRY','THEME','UNIVERSE','MARKET'].map(s=>[s,s]),'All scopes (전체)');
opts($('#f-bundle'),DATA.bundles.map(b=>[b.number,b.number+'. '+b.name]),'No bundle (번들 없음)');
function list(){ const kw=$('#f-kw').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const d=$('#f-domain').value,r=$('#f-role').value,s=$('#f-scope').value,st=$('#f-starter').checked,b=$('#f-bundle').value;
  let pool=DATA.prompts; if(b){ pool=DATA.bundles.find(x=>String(x.number)===b).prompt_ids.map(id=>byId[id]); }
  const res=pool.filter(p=>(!d||p.domain===d)&&(!r||p.role===r)&&(!s||p.scopes.includes(s))&&(!st||DATA.starters.includes(p.prompt_id))
    &&kw.every(k=>[p.prompt_id,p.prompt_code,p.title,p.purpose,...p.keywords,...p.aliases,...p.tags].join('\n').toLowerCase().includes(k)));
  $('#count').textContent=res.length+' / '+DATA.prompts.length;
  $('#list').innerHTML=res.map((p,i)=>`<li data-id="${p.prompt_id}" class="${cur&&cur.prompt_id===p.prompt_id?'on':''}">${b?(i+1)+'. ':''}${DATA.starters.includes(p.prompt_id)?'★ ':''}${esc(p.title)}<div class="code">${p.prompt_code} · ${p.domain} · ${p.role}</div></li>`).join('');
  document.querySelectorAll('#list li').forEach(li=>li.onclick=()=>select(li.dataset.id)); }
function select(id){ cur=byId[id]; for(const k in vals) delete vals[k];
  $('#detail').innerHTML=`<div class="code">${cur.prompt_code} · ${cur.prompt_id} · ${DATA.content_version}</div><h2>${esc(cur.title)}</h2>
   <div>${[cur.domain,cur.role,cur.category,cur.subcategory,cur.system_overlap].map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>
   <p>${esc(cur.purpose)}</p>${cur.aliases.length?`<p class="muted">Aliases (별칭): ${cur.aliases.map(esc).join(' · ')}</p>`:''}
   <h3>Variables (변수)</h3><div id="form"></div><h3>Preview (미리보기)</h3><div id="status"></div><pre id="pv"></pre>
   <button id="copy">Copy (복사)</button> <span id="copied" class="ok"></span>`;
  const system=v=>!!v.owner||v.name==='input_mode';
  $('#form').innerHTML=fieldGroup('target',cur.variables.filter(v=>!system(v)))+fieldGroup('system',cur.variables.filter(system));
  document.querySelectorAll('[data-v]').forEach(el=>el.oninput=el.onchange=()=>{ vals[el.dataset.v]=el.value; render(); });
  const today=document.querySelector('[data-guide-today="as_of"]');
  if(today)today.onclick=()=>{
    const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
    const input=document.getElementById('plv-as_of');input.value=parts.year+'-'+parts.month+'-'+parts.day;input.dispatchEvent(new Event('input',{bubbles:true}));
  };
  $('#copy').onclick=copy; render(); list(); }
function fieldGroup(group,variables){return variables.length?`<fieldset class="field-group" data-guide-group="${group}"><legend data-guide-group-label="${group}">${esc(fieldText(group))}</legend>${variables.map(fieldMarkup).join('')}</fieldset>`:'';}
function fieldMarkup(v){
  const name=esc(v.name),id='plv-'+name,attrs=`id="${id}" data-v="${name}" aria-required="${v.required}" aria-describedby="${id}-description ${id}-source ${id}-error"`;
  let control=v.kind==='INPUT_MODE'?`<select ${attrs}><option value="" data-guide-mode="blank">${esc(fieldText('modeBlank'))}</option>${MODES.map(mode=>`<option value="${mode}" data-guide-mode="${mode}">${esc(fieldText(mode))}</option>`).join('')}</select>`
    :(v.kind==='DATE'||v.kind==='POSITIVE_INT'||['ticker','company','seed_ticker','seed_company','market','period','horizon'].includes(v.name))?`<input ${attrs} placeholder="${esc(guideText(v,'placeholder'))}" autocomplete="off">`
    :`<textarea ${attrs} placeholder="${esc(guideText(v,'placeholder'))}"></textarea>`;
  if(v.name==='as_of')control=`<div class="field-date-row">${control}<button type="button" data-guide-today="as_of">${esc(fieldText('today'))}</button></div>`;
  const modeHelp=v.kind==='INPUT_MODE'?`<ul class="field-mode-notes"><li data-guide-mode-help="modeSystem">${esc(fieldText('modeSystem'))}</li><li data-guide-mode-help="modeStandalone">${esc(fieldText('modeStandalone'))}</li></ul>`:'';
  return `<div class="field-guide" data-field-guide="${name}"><label for="${id}"><span data-guide-label="${name}">${esc(guideText(v,'label'))}</span><span class="field-required" data-guide-required="${name}">${esc(fieldText(v.required?'required':'optional'))}</span></label>
    <p class="field-description" id="${id}-description"><span class="field-caption" data-guide-caption="description">${esc(fieldText('description'))}</span> <span data-guide-description="${name}">${esc(guideText(v,'description'))}</span></p>
    ${control}${modeHelp}<span class="field-error" id="${id}-error" data-field-error="${name}"></span>
    <p class="field-source" id="${id}-source"><span class="field-caption" data-guide-caption="source">${esc(fieldText('source'))}</span> <span data-guide-source="${name}">${esc(guideText(v,'source'))}</span>${v.owner?` <span class="field-import-slot" data-system-import="${name}"></span>`:''}</p>
    <div class="field-code-row"><code class="code" data-guide-variable="${name}">${name}</code>${v.owner?`<span class="field-owner" data-guide-owner="${name}">${esc(fieldText(v.owner))}</span>`:''}</div></div>`;
}
function invalidReason(reason){
  if(reason.includes('placeholder braces'))return 'braces';
  if(reason.includes('not an ISO date'))return 'date';
  if(reason.includes('lies in the future'))return 'future';
  if(reason.includes('strictly before as_of'))return 'prior';
  if(reason.includes('not a positive integer'))return 'positive';
  if(reason.includes('not in SYSTEM_CONTEXT/STANDALONE'))return 'mode';
  return 'invalid';
}
function renderFieldErrors(result){
  for(const v of cur.variables){
    const reasons=result.invalid.filter(reason=>reason.split(':')[0]===v.name).map(reason=>fieldText(invalidReason(reason)));
    if(result.missing.includes(v.name))reasons.unshift(fieldText('missing'));
    const input=document.getElementById('plv-'+v.name),invalid=String(reasons.length>0);if(input.getAttribute('aria-invalid')!==invalid)input.setAttribute('aria-invalid',invalid);
    putText(document.querySelector(`[data-field-error="${v.name}"]`),reasons.join(' '));
  }
}
function plvFieldGuideLocalize(locale){
  fieldLocale=locale==='en-US'?'en-US':'ko-KR';if(!cur)return;
  for(const v of cur.variables){
    for(const key of ['label','description','source'])putText(document.querySelector(`[data-guide-${key}="${v.name}"]`),guideText(v,key));
    const input=document.getElementById('plv-'+v.name);if(v.kind!=='INPUT_MODE'&&input.placeholder!==guideText(v,'placeholder'))input.placeholder=guideText(v,'placeholder');
    putText(document.querySelector(`[data-guide-required="${v.name}"]`),fieldText(v.required?'required':'optional'));
    if(v.owner)putText(document.querySelector(`[data-guide-owner="${v.name}"]`),fieldText(v.owner));
  }
  document.querySelectorAll('[data-guide-group-label]').forEach(node=>putText(node,fieldText(node.dataset.guideGroupLabel)));
  document.querySelectorAll('[data-guide-caption]').forEach(node=>putText(node,fieldText(node.dataset.guideCaption)));
  document.querySelectorAll('[data-guide-mode]').forEach(node=>putText(node,fieldText(node.dataset.guideMode==='blank'?'modeBlank':node.dataset.guideMode)));
  document.querySelectorAll('[data-guide-mode-help]').forEach(node=>putText(node,fieldText(node.dataset.guideModeHelp)));
  putText(document.querySelector('[data-guide-today="as_of"]'),fieldText('today'));
  renderFieldErrors(plvCheck(cur,vals));
}
window.plvFieldGuideLocalize=plvFieldGuideLocalize;
function render(){ const r=plvCheck(cur,vals); $('#pv').textContent=r.text; $('#copy').disabled=!r.ready; $('#copied').textContent='';
  renderFieldErrors(r);
  $('#status').innerHTML=r.ready?'<p class="ok">Ready to copy (복사 가능)</p>':
    (r.missing.length?`<p class="bad">Missing required (필수 누락): ${r.missing.join(', ')}</p>`:'')+(r.invalid.length?`<p class="bad">Invalid (오류): ${r.invalid.map(esc).join(' / ')}</p>`:''); }
function copy(){ const r=plvCheck(cur,vals); if(!r.ready) return;
  const done=()=>{$('#copied').textContent='Copied (복사됨)';};
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(r.text).then(done,fallback); } else fallback();
  function fallback(){ const t=document.createElement('textarea'); t.value=r.text; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); done();}catch(e){} t.remove(); } }
['#f-kw','#f-domain','#f-role','#f-scope','#f-starter','#f-bundle'].forEach(s=>{$(s).oninput=$(s).onchange=list;});
list();
const h=decodeURIComponent(location.hash.slice(1)); if(byId[h]) select(h);  // deep link: page.html#plv1.tech.001
</script></body></html>
