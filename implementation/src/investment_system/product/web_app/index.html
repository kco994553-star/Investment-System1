<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://apis.google.com/js/api.js https://apis.google.com/_/scs/; style-src 'self' https://accounts.google.com/gsi/style; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://sheets.googleapis.com https://oauth2.googleapis.com https://private-investment-history.kco994553.workers.dev; img-src 'self' data:; frame-src 'self' https://accounts.google.com https://docs.google.com https://www.tradingview-widget.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>투자시스템 지도</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <noscript>이 화면은 JavaScript가 필요합니다.</noscript>
    <div id="app"></div>
    <!-- First screen only (P2-1a, owner 2026-10-24): P0 base (DOM builder and router, shell, shared parts), the loader, the
         screens, then boot.js, which draws the shell and asks the loader for the rest. The reused old modules and the P1 layer
         load after the first paint from loader.js LOAD_ORDER, the one load list (the build's plan-A reuse rule reads it there). -->
    <script defer src="core.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="parts.js"></script>
    <!-- Before the screens, so IS2.data / qgv / prices / store / engines are the loader's facades when a screen file runs. -->
    <script defer src="loader.js"></script>
    <!-- P2 lane screens (placeholders until each lane lands; they load before the P0 placeholder menus). -->
    <script defer src="screen-qgv.js"></script>
    <script defer src="screen-technical.js"></script>
    <script defer src="screen-macro.js"></script>
    <script defer src="screen-news.js"></script>
    <script defer src="screen-portfolio.js"></script>
    <script defer src="screen-prompts.js"></script>
    <script defer src="screen-tree.js"></script>
    <script defer src="screen-lab.js"></script>
    <!-- P0 screens, then start. -->
    <script defer src="screen-search.js"></script>
    <script defer src="screen-menus.js"></script>
    <script defer src="screen-detail.js"></script>
    <script defer src="boot.js"></script>
  </body>
</html>
