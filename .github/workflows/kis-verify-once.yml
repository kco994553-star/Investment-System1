# ONE-TIME KIS VERIFICATION (owner 2026-10-31). Runs only on pushes to this branch; never merged. Last KIS run:
# KIS auth (token issue + revoke) plus a one-time comparison of the IEX HIST last regular-session trade with the KIS daily
# close for a fixed 100-symbol sample. Secrets are injected into one step only. Prices stay in RAM; the script prints
# aggregate lines only (never keys, tokens, prices, per-symbol values or response bodies). No order/account endpoints.
name: kis-verify-once
on:
  push:
    branches: [claude/kis-verify-once]
permissions:
  contents: read
concurrency:
  group: kis-verify-once
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the IEX TOPS parser
        run: cc -O2 -o "$RUNNER_TEMP/iex_last_trade" implementation/tools/iex_tops/iex_last_trade.c
      - name: KIS auth and IEX-vs-KIS comparison (aggregate lines only)
        if: github.run_attempt == 1   # one keyed run: a UI re-run does not call KIS again
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          IEX_PARSER: ${{ runner.temp }}/iex_last_trade
          IEX_WORKDIR: ${{ runner.temp }}
        run: timeout -k 30s 55m python implementation/tools/measure_once/kis_iex_compare_once.py
