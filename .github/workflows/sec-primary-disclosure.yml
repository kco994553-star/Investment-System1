name: sec-primary-disclosure
on:
  pull_request:
  push:
    branches:
      - feature/sec-primary-disclosure-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audited read-only pins used by the ingestion tests
        run: |
          git fetch --depth=1 origin ccr-41677301-10nj3u
          git fetch --depth=1 origin feature/producer-infrastructure-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline disclosure tests and full mini_pytest regression
        working-directory: implementation
        run: python tools/mini_pytest.py
