name: sec-primary-disclosure
on:
  pull_request:
  push:
    branches:
      - feature/sec-primary-disclosure-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch audited read-only pins used by the ingestion tests
        run: |
          git fetch origin ccr-41677301-10nj3u
          git fetch origin feature/producer-infrastructure-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native regression runner
        run: python -m pip install pytest==9.1.1 numpy==2.3.5
      - name: Offline disclosure tests and full native pytest regression
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q
