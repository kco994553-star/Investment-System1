name: browser-look
# Browser checks of how screens look (owner 2026-11-18, PR-check time): moved out of the PR checks, the manual deploy and the
# daily verify so they no longer add to the wait. It is its own workflow and gates nothing: a failure here never blocks Pages
# or the daily publication. GitHub notifies the account that last edited the schedule when a scheduled run fails.
# The list and the reason for each entry: implementation/tools/ci_browser_tests_look.txt. Boundary, value and data-safety
# checks are not in it; they stay in ci_browser_tests.txt.
on:
  schedule:
    - cron: '41 18 * * *'   # daily 18:41 UTC (03:41 KST)
  workflow_dispatch:
  pull_request:
    # Only a PR that changes this check itself runs it; ordinary PRs do not.
    paths:
      - .github/workflows/browser-look.yml
      - implementation/tools/ci_browser_tests_look.txt
      - implementation/tools/web_state_presentation_browser_test.js
      - implementation/tools/web_state_presentation_look_browser_test.js
permissions:
  contents: read
concurrency:
  group: browser-look-${{ github.ref }}
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and inspect local price-free cockpit
        run: |
          python -m pip install jsonschema==4.26.0
          python implementation/tools/build_pages_cockpit.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Browser checks of how screens look
        env:
          NODE_PATH: ${{ runner.temp }}/pages-browser/node_modules
          PAGES_COCKPIT_URL: http://127.0.0.1:8990/
          PAGES_COCKPIT_EVIDENCE_DIR: ${{ runner.temp }}/look-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-browser" playwright@1.58.2
          "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8990 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public-cockpit" > "$RUNNER_TEMP/pages-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          bash implementation/tools/run_js_tests.sh implementation/tools/ci_browser_tests_look.txt
