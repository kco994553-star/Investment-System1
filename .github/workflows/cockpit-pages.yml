name: cockpit-pages
on:
  pull_request:
  workflow_dispatch:
    inputs:
      replay_20261020:
        description: '10/20 수집 artifact의 데이터만 복구 (재수집·관측 추가 없음)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  replay_source:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_20261020 && github.ref_name == 'claude/investment-system-top500-validation-alrugm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cross-run reads cover this repository's Actions data, not just the pinned ID.
    # Keep the token out of PR builds; this job executes no checked-out code.
    permissions:
      actions: read
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Read only the required metadata for the fixed 10/20 recovery source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/replay-source"
          gh api --method GET repos/kco994553-star/Investment-System1/actions/runs/39522288311 --jq '{id, head_sha, head_branch, event, status, conclusion, path, repository: {full_name: .repository.full_name}, head_repository: {full_name: .head_repository.full_name}}' > "$RUNNER_TEMP/replay-source/run-metadata.json" 2>/dev/null || { echo 'REPLAY_20261020_FAILED reason=RUN_METADATA_FETCH_FAILED'; exit 1; }
          gh api --method GET repos/kco994553-star/Investment-System1/actions/artifacts/12311543375 --jq '{id, name, size_in_bytes, digest, expired, expires_at, workflow_run: {id: .workflow_run.id, head_sha: .workflow_run.head_sha, head_branch: .workflow_run.head_branch}}' > "$RUNNER_TEMP/replay-source/artifact-metadata.json" 2>/dev/null || { echo 'REPLAY_20261020_FAILED reason=ARTIFACT_METADATA_FETCH_FAILED'; exit 1; }
      - name: Download the fixed 10/20 recovery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '12311543375'
          run-id: '39522288311'
          repository: kco994553-star/Investment-System1
          github-token: ${{ github.token }}
          merge-multiple: true # A single fixed ID; place artifact.tar directly in replay-source.
          path: ${{ runner.temp }}/replay-source
      - name: Hand the public source to this run's unprivileged build
        id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-20261020-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/replay-source/artifact.tar
            ${{ runner.temp }}/replay-source/run-metadata.json
            ${{ runner.temp }}/replay-source/artifact-metadata.json
          retention-days: 1
          if-no-files-found: error
  build:
    needs: replay_source
    # A skipped opt-in source must not skip ordinary PR/manual builds. Failed/cancelled sources block replay.
    if: ${{ !cancelled() && (needs.replay_source.result == 'success' || (needs.replay_source.result == 'skipped' && !inputs.replay_20261020)) }}
    runs-on: ubuntu-latest
    # 60 (was 30): the full Python suite plus the browser list now takes about 28 minutes on an empty PR build and
    # longer on a manual deploy, whose artifact carries the published data (504 Universe rows); the 2026-10-19 run
    # 39251288211 was cancelled at 30:00 while its tests were still passing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline public boundary regression (GSQ-010)
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1 jsonschema==4.26.0
          python -m pytest -q --tb=no tests/test_app_nav_ia.py tests/test_public_price_boundary.py tests/test_pages_cockpit_build.py tests/test_pages_artifact_guard.py tests/test_device_actual_build.py tests/test_private_history_build.py tests/test_sec_m1_provider.py tests/test_sec_m2_qg.py tests/test_sec_m2_candidates.py tests/test_worker_deployment_diagnostics.py tests/test_public_sec_inputs.py tests/test_sec_reported_consumer.py tests/test_public_engine_screens.py tests/test_public_screens_pipeline.py tests/test_device_profile_defaults.py tests/test_preserve_public_sec_inputs.py
      - name: Full Python unit suite
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q --tb=short -p no:cacheprovider tests
      - name: Build and inspect local price-free cockpit
        run: |
          python implementation/tools/build_pages_cockpit.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Preserve previously published validated SEC observations for UI deployment
        if: github.event_name == 'workflow_dispatch' && !inputs.replay_20261020
        run: |
          python implementation/tools/preserve_public_sec_inputs.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/preserve_public_screens.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/public_classification_pipeline.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/sec_universe_shares.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/dart_daily.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/forward_validation_ledger.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/universe_domains_pipeline.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/company_logos_pipeline.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/sec_disclosures.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/news_signals.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/macro_evidence.py --preserve-only --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Download this run's public recovery source
        if: github.event_name == 'workflow_dispatch' && inputs.replay_20261020
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.replay_source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/replay-source
      - name: Restore only the fixed collected JSON into fresh code and inspect it
        if: github.event_name == 'workflow_dispatch' && inputs.replay_20261020
        run: |
          python implementation/tools/replay_pages_20261020.py --archive "$RUNNER_TEMP/replay-source/artifact.tar" --run-metadata "$RUNNER_TEMP/replay-source/run-metadata.json" --artifact-metadata "$RUNNER_TEMP/replay-source/artifact-metadata.json" --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify device features and price-free pages locally
        env:
          NODE_PATH: ${{ runner.temp }}/pages-browser/node_modules
          PAGES_COCKPIT_URL: http://127.0.0.1:8990/
          PRIVATE_HISTORY_URL: http://127.0.0.1:8990/
          PAGES_COCKPIT_EVIDENCE_DIR: ${{ runner.temp }}/pages-browser-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-browser" playwright@1.58.2
          "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
          bash implementation/tools/run_js_tests.sh implementation/tools/ci_node_tests.txt
          node --test implementation/worker/tests/*.test.mjs
          python -m http.server 8990 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public-cockpit" > "$RUNNER_TEMP/pages-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          bash implementation/tools/run_js_tests.sh implementation/tools/ci_browser_tests.txt
          (cd implementation && PYTHONPATH=src python -m tests.build_sec_m2_candidate_fixture --out "$RUNNER_TEMP/m2-test-sites")
          python -m http.server 8992 --bind 127.0.0.1 --directory "$RUNNER_TEMP/m2-test-sites" > "$RUNNER_TEMP/m2-test-server.log" 2>&1 &
          M2_SERVER_PID=$!
          trap 'kill "$SERVER_PID" "$M2_SERVER_PID"' EXIT
          M2_BROWSER_EVIDENCE="$RUNNER_TEMP/m2-browser-evidence" node implementation/tools/sec_m2_candidates_browser_test.js

      - name: Upload checked price-free Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/investment-system-top500-validation-alrugm'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/public-cockpit
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/investment-system-top500-validation-alrugm'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: checked-cockpit-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the Pages artifact this job deploys
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      # Owner queue 2026-10-17 §5 (amended 2026-10-17): inside the job that holds the Pages group, right before the deploy.
      # Compared row by row with the live Pages copy of the same file: a live row with an acquired_at must be in the
      # artifact with an equal or later acquired_at (missing row, lost or earlier acquired_at -> refused; a normal NA row
      # of new calculation rules collected at least as recently passes), and the ledger is append only (every live record
      # kept unchanged and in order). Live copy served but invalid -> PAGES_FRESHNESS_LIVE_INVALID, refused: restoring a
      # healthy live copy is a separate, evidence-based procedure, never automatic. Live 404 -> first publication (pass);
      # live unreachable -> refused (fail closed). Fixed lines only: counts, dates and public row codes.
      - name: Refuse to deploy public data older than the live Pages copy
        run: |
          mkdir "$RUNNER_TEMP/deploy-check"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/deploy-check"
          python implementation/tools/pages_freshness_guard.py --artifact-dir "$RUNNER_TEMP/deploy-check"
      - name: Refuse recovery unless all 25 live files are audited baseline or fixed source bytes
        if: inputs.replay_20261020
        run: python implementation/tools/replay_pages_20261020.py --check-deploy --out "$RUNNER_TEMP/deploy-check"
      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
