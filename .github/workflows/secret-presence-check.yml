# One-off check (owner request 2026-10-24: "등록되면 이름만으로 존재를 확인한다"). Runs only on a push to this branch; the branch is
# never merged. It prints, per secret, only whether it is set; for the HMAC key only whether it is at least 16 bytes (the
# publisher's minimum); for the read token only the HTTP status of one read of the private V4 month-end store's release tag
# (Contents: Read-only on kco994553-star/investment-system1-raw). No value, length, header or response body is printed.
name: Secret presence check (names only)
on:
  push:
    branches: [claude/secret-presence-check]
permissions: {}
concurrency:
  group: secret-presence-check
  cancel-in-progress: false
jobs:
  presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report presence only (never values)
        env:
          HMAC_KEY: ${{ secrets.QGV_OFFICIAL_HMAC_KEY }}
          READ_TOKEN: ${{ secrets.RAW_REPO_READ_TOKEN }}
        run: |
          if [ -n "$HMAC_KEY" ]; then echo "SECRET_PRESENT name=QGV_OFFICIAL_HMAC_KEY set=yes"; else echo "SECRET_PRESENT name=QGV_OFFICIAL_HMAC_KEY set=no"; fi
          if [ "$(printf '%s' "$HMAC_KEY" | wc -c)" -ge 16 ]; then echo "HMAC_KEY_MIN_16_BYTES ok=yes"; else echo "HMAC_KEY_MIN_16_BYTES ok=no"; fi
          if [ -n "$READ_TOKEN" ]; then echo "SECRET_PRESENT name=RAW_REPO_READ_TOKEN set=yes"; else echo "SECRET_PRESENT name=RAW_REPO_READ_TOKEN set=no"; fi
          if [ -n "$READ_TOKEN" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/kco994553-star/investment-system1-raw/releases/tags/iex-v4-monthend-20261023-shard0 || echo 000)
            echo "RAW_REPO_READ_TOKEN_STORE_READ http=$code"
          fi
