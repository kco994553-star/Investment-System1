name: Deploy private history manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-investment-history-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run mocked Worker tests without live providers
        run: node --test implementation/worker/tests/*.test.mjs
      - name: Test deployment diagnostics without live credentials
        run: python -m unittest discover -s implementation/tests -p test_worker_deployment_diagnostics.py
      - name: Preflight and deploy Worker and SQLite binding
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python implementation/tools/deploy_private_history_worker.py deploy
      - name: Verify anonymous rejection without Google or Yahoo requests
        env:
          WORKER_ORIGIN: ${{ steps.worker.outputs.origin }}
        run: python implementation/tools/deploy_private_history_worker.py verify
