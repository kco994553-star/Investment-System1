name: p01-research-publication
on:
  pull_request:
  push:
    branches:
      - feature/p01-research-publication-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full mini_pytest including P01 publication
        working-directory: implementation
        run: python tools/mini_pytest.py
