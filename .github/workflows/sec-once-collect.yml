# ONE-TIME SEC COLLECTION (owner decision 2026-11-01: "SEC 1회용 수집: 조건부 승인 ... 승인 뒤 실행한다"). Plan:
# implementation/docs/lab/SEC_ONCE_COLLECTION_PLAN_20261101.md. It runs ONLY on a push to claude/sec-once-collect-run,
# which Main makes once after the owner approves the plan PR. No other event starts it (pull requests, schedules and
# manual runs never do), and the job checks the branch and repository again. Public SEC files only: bulk companyfacts.zip and
# submissions.zip, EDGAR full-index form.idx / company.idx 2014 QTR1 .. 2026 QTR4, Financial Statement Data Sets
# 2014q1 .. 2026q3, plus the ticker-mismatch classification of the 2026-11-01 measurement sample. Everything goes to ONE
# new release sec-once-v1-<run id> of the private raw repository (create-only; the name and the allowed GitHub calls are
# fixed in code). Nothing is published, cached, uploaded as an artifact or written to the step summary. No prices, no KIS.
# Each step holds at most one Secret. The log carries fixed SECONCE_* / TICKERMIX_* / PITTICKER* count lines only.
# A failed run is resumed with "Re-run failed jobs" (same run id, same release; verified assets are not fetched again).
name: sec-once-collect
on:
  push:
    branches: [claude/sec-once-collect-run]
permissions:
  contents: read
concurrency:
  group: sec-once-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/sec-once-collect-run' && github.repository == 'kco994553-star/Investment-System1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Offline first (synthetic inputs, no network, no Secret): a failing check stops the job before any request.
      # --tb=no: a failure names the test only, so no test value reaches the log.
      - name: Offline unit tests of the collection, the classifier and the moved measurement (no network, no Secret)
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1
          PYTHONPATH=src python -m pytest -q --tb=no -p no:cacheprovider tests/test_sec_once_collect.py tests/test_sec_once_ticker_mismatch.py tests/test_fv3_pit_ticker_measure.py
      # Fixed file list and planned request counts; stops (exit 2) before any request when the runner has too little disk.
      - name: Fixed plan and free-disk check (no network, no Secret)
        run: python implementation/tools/measure_once/sec_once_collect.py plan --work "$RUNNER_TEMP/sec-once"
      # Attempt 1 reads nothing. A re-run attempt reads only this run's own release (tag sec-once-v1-<run id>) and keeps
      # the assets whose sha256 sidecar matches, so they are neither fetched from SEC nor uploaded again.
      - name: Resume check of this run's own release (re-run attempts only; RAW_REPO_TOKEN only)
        timeout-minutes: 30
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
        run: python implementation/tools/measure_once/sec_once_collect.py resume-check --work "$RUNNER_TEMP/sec-once"
      # The only step that holds the SEC User-Agent. Both scripts stop with one fixed line when it is missing and never
      # print it. A partial collection (a failed file, a stop) still exits 0 so the next step stores what was collected;
      # the last step then fails the job.
      - name: Collect the planned SEC files and classify the ticker mismatches (SEC_USER_AGENT only; fixed count lines)
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python implementation/tools/measure_once/sec_once_collect.py collect --work "$RUNNER_TEMP/sec-once"
          python implementation/tools/measure_once/sec_once_ticker_mismatch.py --work "$RUNNER_TEMP/sec-once"
      # Creates the release (attempt 1: create only, no read), uploads every file with a sha256 sidecar (files over
      # 2,000,000,000 bytes in parts), the manifest last, then downloads each new asset back and checks its sha256.
      - name: Upload to the new private release sec-once-v1-<run id> and verify it back (RAW_REPO_TOKEN only)
        timeout-minutes: 45
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
        run: python implementation/tools/measure_once/sec_once_collect.py upload --work "$RUNNER_TEMP/sec-once"
      - name: Completeness check (fails the job when anything is missing, so "Re-run failed jobs" resumes it)
        run: python implementation/tools/measure_once/sec_once_collect.py done --work "$RUNNER_TEMP/sec-once"
