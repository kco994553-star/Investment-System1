name: SEC daily public reported inputs
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      all_shards:
        description: '1회성: 504종목 전체 샤드를 한 번에 수집(새 계산 규칙 게시용)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  dependency:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.module.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check merged Codex2 collection module without credentials
        id: module
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          ready = Path('implementation/src/investment_system/providers/sec_collection.py').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('SEC_MODULE_AVAILABLE' if ready else 'SEC_MODULE_NOT_MERGED')
          PYCODE
  # Collection, public JSON and the forward validation ledger. This job never depends on screen verification: its
  # raw/private uploads and the ledger's dated raw-repo release happen inside its own steps, and the checked public
  # artifact is handed to `verify` and `deploy` as the run's Pages artifact (it is only published by `deploy`).
  collect:
    needs: dependency
    if: needs.dependency.outputs.ready == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Scheduled runs keep 40 minutes. A one-off all-shards dispatch collects all 7 shards serially at the same SEC
    # pacing (about 5.5 minutes per shard measured on 2026-10-14, so about 40 minutes for the shard step alone).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.all_shards && 120 || 40 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline public boundary regression (GSQ-010)
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1 jsonschema==4.26.0
          python -m pytest -q --tb=no tests/test_app_nav_ia.py tests/test_public_price_boundary.py tests/test_pages_cockpit_build.py tests/test_pages_artifact_guard.py tests/test_device_actual_build.py tests/test_private_history_build.py tests/test_sec_m1_provider.py tests/test_sec_m2_qg.py tests/test_sec_m2_candidates.py tests/test_worker_deployment_diagnostics.py tests/test_public_sec_inputs.py tests/test_sec_reported_consumer.py tests/test_public_engine_screens.py tests/test_public_screens_pipeline.py tests/test_device_profile_defaults.py tests/test_sec_13f_managers.py tests/test_sec_universe_shares.py tests/test_sec_universe_qg.py tests/test_macro_growth_inflation_v0.py tests/test_forward_validation_ledger.py tests/test_sic_theme_v0.py
      - name: Build and inspect local price-free cockpit
        run: |
          python implementation/tools/build_pages_cockpit.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Collect public SEC shares and filing metadata through Codex2 client
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BEA_USERID: ${{ secrets.BEA_USERID }}
        run: |
          python implementation/tools/public_screens_pipeline.py --live --macro-v0 --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Collect OpenDART disclosures and periodic financials for 042700 (fixed codes and call count only)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python implementation/tools/dart_daily.py --out "$RUNNER_TEMP/public-cockpit" --qgv2-history
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      # One paced fetch per shard issuer feeds both price-free files: sec-universe-shares.json and sec-universe-qg.json (TARGET Q·G path).
      # A manual dispatch with all_shards=true collects every shard in this one step (one-off publication under the
      # current calculation rules); scheduled runs pass no flag and collect today's shard only.
      - name: Collect Universe504 SEC shard (price-free shares and Q·G factor projections)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
          ALL_SHARDS_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.all_shards && '--all-shards' || '' }}
        run: |
          python implementation/tools/sec_universe_shares.py --live --out "$RUNNER_TEMP/public-cockpit" $ALL_SHARDS_FLAG
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Project collected DART inputs with the same QGV v2 formulae (reference only)
        run: |
          python implementation/tools/project_dart_qgv2.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      # W-F2 (2026-10-15): the previous ledger is read from the newest dated private release first and from Pages when that
      # copy is missing, invalid, older or diverged, so a day whose deploy was withheld is carried into the next ledger.
      - name: Append forward validation ledger (price-free, append-only)
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
          FORWARD_LEDGER_PREVIOUS_SOURCE: RAW_FIRST
        run: |
          python implementation/tools/forward_validation_ledger.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      # W-F1 (2026-10-15): required steps that do not feed the ledger run after it. Their failure still withholds the
      # Pages artifact (and so the screen check and deploy), but no longer the day's ledger row or its dated private copy.
      - name: Collect SEC SIC, 10-K Item 1 and basket-ETF N-PORT evidence for industry/theme v0
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python implementation/tools/public_classification_pipeline.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Collect company web domains for build-time logos (SEC website, then Wikidata P856; domains only)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python implementation/tools/universe_domains_pipeline.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/company_logos_pipeline.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Verify 13F manager CIKs and project reported quantity changes
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python implementation/tools/sec_13f_managers.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Collect SEC 8-K current reports for TARGET (title, link, time and item metadata only)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python implementation/tools/sec_disclosures.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Collect news signals for TARGET (GDELT DOC 2.0 and company IR feeds; title, link and time only, never a score input)
        continue-on-error: true
        run: |
          python implementation/tools/news_signals.py --live --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      # Last step before the upload so the line sits at the end of the job log (the log API returns the last 5000
      # lines). Counts, dates and version of the FINAL artifact's sec-qgv2.json only; reporting never withholds upload.
      - name: Report published Q·G coverage of the final artifact (counts only)
        continue-on-error: true
        run: python implementation/tools/published_coverage.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - name: Upload checked public SEC Pages artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/public-cockpit
  # Screen verification of exactly the artifact collect uploaded. Its failure withholds deploy only.
  verify:
    needs: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned test helpers used by the m2 browser fixture
        run: python -m pip install pytest==9.1.1 jsonschema==4.26.0
      - name: Download the checked public SEC Pages artifact from collect
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Unpack and re-inspect the artifact deploy would publish
        run: |
          mkdir "$RUNNER_TEMP/public-cockpit"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify device features and price-free pages locally
        env:
          NODE_PATH: ${{ runner.temp }}/pages-browser/node_modules
          PAGES_COCKPIT_URL: http://127.0.0.1:8990/
          PRIVATE_HISTORY_URL: http://127.0.0.1:8990/
          PAGES_COCKPIT_EVIDENCE_DIR: ${{ runner.temp }}/pages-browser-evidence
        # A failure prints one fixed token, DAILY_VERIFY_FAILED test=<manifest entry> exit=<code>, and withholds only deploy.
        run: |
          VERIFY=implementation/tools/daily_verify_step.sh
          bash "$VERIFY" playwright-install npm install --prefix "$RUNNER_TEMP/pages-browser" playwright@1.58.2
          bash "$VERIFY" playwright-install "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
          bash "$VERIFY" ci_node_tests.txt bash implementation/tools/run_js_tests.sh implementation/tools/ci_node_tests.txt
          bash "$VERIFY" worker-tests node --test implementation/worker/tests/*.test.mjs
          python -m http.server 8990 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public-cockpit" > "$RUNNER_TEMP/pages-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          bash "$VERIFY" ci_browser_tests.txt bash implementation/tools/run_js_tests.sh implementation/tools/ci_browser_tests.txt
          (cd implementation && PYTHONPATH=src python -m tests.build_sec_m2_candidate_fixture --out "$RUNNER_TEMP/m2-test-sites")
          python -m http.server 8992 --bind 127.0.0.1 --directory "$RUNNER_TEMP/m2-test-sites" > "$RUNNER_TEMP/m2-test-server.log" 2>&1 &
          M2_SERVER_PID=$!
          trap 'kill "$SERVER_PID" "$M2_SERVER_PID"' EXIT
          M2_BROWSER_EVIDENCE="$RUNNER_TEMP/m2-browser-evidence" bash "$VERIFY" sec_m2_candidates_browser_test.js node implementation/tools/sec_m2_candidates_browser_test.js
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.verify.result == 'success'
    needs: [collect, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: checked-cockpit-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the Pages artifact this job deploys
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      # Owner queue 2026-10-17 §5 (amended 2026-10-17): inside the job that holds the Pages group, right before the deploy.
      # Compared row by row with the live Pages copy of the same file: a live row with an acquired_at must be in the
      # artifact with an equal or later acquired_at (missing row, lost or earlier acquired_at -> refused; a normal NA row
      # of new calculation rules collected at least as recently passes), and the ledger is append only (every live record
      # kept unchanged and in order). Live copy served but invalid -> PAGES_FRESHNESS_LIVE_INVALID, refused: restoring a
      # healthy live copy is a separate, evidence-based procedure, never automatic. Live 404 -> first publication (pass);
      # live unreachable -> refused (fail closed). Fixed lines only: counts, dates and public row codes.
      - name: Refuse to deploy public data older than the live Pages copy
        run: |
          mkdir "$RUNNER_TEMP/deploy-check"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/deploy-check"
          python implementation/tools/pages_freshness_guard.py --artifact-dir "$RUNNER_TEMP/deploy-check"
      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
