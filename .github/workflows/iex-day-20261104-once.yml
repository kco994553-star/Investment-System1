name: iex-day-20261104-once
# One-off private IEX HIST day store for QGV 555 V (owner approval 2026-11-14; route choice 2026-11-14: a one-off tool on this
# unmerged run branch, like the U8 month-end store of 2026-10-23). The 2026-11-04 TOPS 1.6 file is streamed with the same IEX
# functions as the central V publication; prices stay in RAM and go ONLY to private release assets of the raw repository (tags
# iex-day-20261104-shard0..1). Logs carry counts, sizes and hashes only. No artifact upload, cache or job summary.
# The request (listing codes, no prices) is read from the raw repository at a pinned commit. Never merged to canonical.
on:
  push:
    branches: ['claude/iex-day-20261104-once']
permissions:
  contents: read
concurrency:
  group: iex-day-20261104-once
  cancel-in-progress: false
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the pinned request (listing codes only) from the private raw repository
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          sha = '4eb4551d5bdaa73f07d01ab52f4690f78e662e87'
          head = {'Authorization': 'Bearer ' + os.environ['RAW_REPO_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'investment-system-raw-archive'}
          base = 'https://api.github.com/repos/kco994553-star/investment-system1-raw'
          # Run once: an existing iex-day-20261104 release means the store already ran.
          req = urllib.request.Request(base + '/releases?per_page=100', headers={**head, 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              tag = 'iex-day-20261104-shard' + os.environ['SHARD']
              if any(x.get('tag_name') == tag for x in json.load(r)):
                  raise SystemExit('IEX_DAY status=SKIPPED reason=ALREADY_STORED')
          req = urllib.request.Request(base + '/contents/handoffs/iex-day-20261104/request.json?ref=' + sha,
                                       headers={**head, 'Accept': 'application/vnd.github.raw'})
          with urllib.request.urlopen(req, timeout=60) as r:
              body = r.read()
          open(os.environ['RUNNER_TEMP'] + '/request.json', 'wb').write(body)
          print('IEX_DAY request codes=' + str(len(json.loads(body)['codes'])))
          PY
      - name: Build the parser (no Secret)
        run: cc -O2 -o "$RUNNER_TEMP/iex_last_trade" implementation/tools/iex_tops/iex_last_trade.c
      - name: Store one shard of 2026-11-04 (prices in RAM -> private release asset; counts only)
        timeout-minutes: 30
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          timeout -k 30s 27m python implementation/tools/iex_day_private_once.py --day 2026-11-04 --request "$RUNNER_TEMP/request.json" \
            --shard "$SHARD" --shards 2 --parser "$RUNNER_TEMP/iex_last_trade"
