name: web-sequential-integration-gate
on:
  push:
    branches: [integration/web-mvp-language-search-audit]
    paths: ['.github/workflows/web-sequential-integration-gate.yml', 'implementation/tools/web_sequential_integration_gate.py']
permissions:
  contents: read
jobs:
  sequential-normal-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Actual git worktree, PR5 normal merge and tests, then PR6 normal merge and combined gate
        run: python implementation/tools/web_sequential_integration_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-sequential-integration-evidence
          path: integration-evidence
          retention-days: 30
