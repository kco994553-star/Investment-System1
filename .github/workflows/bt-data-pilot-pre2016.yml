name: BT-DATA-PILOT v0.6 pre-2016 private price extension
on:
  push:
    branches: [research/bt-data-pilot-alpaca-probe-20261031]
    paths: [.github/workflows/bt-data-pilot-pre2016.yml]
permissions:
  contents: read
concurrency:
  group: bt-data-pilot-v06-kis-probe
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Quote-only historical probe with bounded explicit dates
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/prior-kis"
          gh release download bt-data-pilot-v06-kis-41167986542-1 --repo kco994553-star/investment-system1-raw --pattern 'private-inputs.zip*' --dir "$RUNNER_TEMP/prior-kis"
          mkdir -p "$RUNNER_TEMP/pre2016-resume"
          gh release download bt-data-pilot-v06-pre2016-41172239025-1 --repo kco994553-star/investment-system1-raw --pattern 'final.zip*' --dir "$RUNNER_TEMP/pre2016-resume"
          python implementation/experiments/bt-data-pilot-v06/pre2016_prices.py --phase 2010 --resume-zip "$RUNNER_TEMP/pre2016-resume/final.zip" --private-dir "$RUNNER_TEMP/pre2016" --prior-zip "$RUNNER_TEMP/prior-kis/private-inputs.zip"
