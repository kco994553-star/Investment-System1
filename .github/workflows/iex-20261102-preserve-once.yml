# ONE-SHOT, OWNER-APPROVED RUN ONLY (owner directive 2026-11-05, plan "안 A";
# implementation/docs/expanded_universe/IEX_20261102_PRESERVE_ONCE_20261105.md).
# Preserves the IEX HIST TOPS 1.6 original of exactly 2026-11-02 in the PRIVATE repository investment-system1-raw
# (release current-iex-20261102: verified 1,000,000,000-byte chunks + manifest.json) and derives the last regular-session
# trade of the 11 financial candidate codes (private only). Nothing is published; nothing is pushed or committed.
# Budget: at most 3 source GETs (hist index <= 8 MiB, object metadata <= 1 MiB, body streamed once), free, no retry,
# no Range/resume, no other date. Body cap 20,000,000,000 bytes (index size = metadata size). Private release requests
# (reads, uploads, download-back checks, deletes) are counted apart in the run's manifest.
# Trigger: a push of the exact branch run/iex-20261102-once only (no pull_request / schedule / dispatch). Push that branch
# ONLY after the owner's approval, and delete the branch after the run (success or failure) only once the run id, the code SHA, the COMPLETE or FAILED
# manifest in the private release and the same SHA on the prep branch are confirmed; a re-run needs a new
# approval. Logs: fixed codes, counts, sizes, hashes, HTTP status and exit codes only (no prices, symbols, codes, URLs,
# tokens or response bodies). The tool is public_price_boundary.ACTIONS_PRICE_ROUTES entry 2 and asks require_price_source
# before each source GET; its asset names carry this run's id (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT), it refuses a release
# that already holds a COMPLETE manifest, and it deletes only assets it created itself. Disk: >= 22e9 bytes free before the
# first source GET, >= size + 2e9 after the metadata.
name: iex-20261102-preserve-once
on:
  push:
    branches: ['run/iex-20261102-once']
permissions:
  contents: read
concurrency:
  group: iex-20261102-preserve-once
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Synthetic tests of the one-shot tool (no secret, no source request)
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1 jsonschema==4.26.0
          PYTHONPATH=src python -m pytest -q --tb=line -p no:cacheprovider tests/test_iex_day_preserve_once.py tests/test_iex_hist.py
      - name: Build the parser (existing symbols-file mode) and record versions
        run: |
          python --version
          cc --version | head -1
          cc -O2 -o "$RUNNER_TEMP/iex_last_trade" implementation/tools/iex_tops/iex_last_trade.c
          sha256sum implementation/tools/iex_tops/iex_last_trade.c | cut -c1-64
      - name: Free runner disk (remove large preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/iex-preserve"
          df -B1 --output=avail "$RUNNER_TEMP/iex-preserve" | tail -1
      - name: Preserve the 2026-11-02 original once (3 source GETs at most)
        timeout-minutes: 140
        env:
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
        run: python implementation/tools/iex_day_preserve_once.py --live --parser "$RUNNER_TEMP/iex_last_trade" --workdir "$RUNNER_TEMP/iex-preserve"
