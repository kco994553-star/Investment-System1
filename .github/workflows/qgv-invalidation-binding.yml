name: qgv-invalidation-binding
on:
  pull_request:
  push:
    branches:
      - feature/qgv-invalidation-binding-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native regression runner
        run: python -m pip install pytest==9.1.1
      - name: Full native pytest including QGV invalidation binding
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q
