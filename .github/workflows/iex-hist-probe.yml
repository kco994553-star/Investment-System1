name: iex-hist-probe
# One-off feasibility probe (owner decision 2026-10-23: IEX HIST as the central V price source, validate first).
# Separate from the daily collect / ledger workflows. Streams one day's TOPS file through a C parser; nothing is stored,
# uploaded or logged except counts and timings (no prices, GSQ-010).
on:
  push:
    branches: [claude/iex-hist-probe]
    paths: ['implementation/tools/iex_hist/**', '.github/workflows/iex-hist-probe.yml']
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD (empty = latest day with a TOPS 1.6 file)'
        required: false
permissions:
  contents: read
concurrency:
  group: iex-hist-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build parser
        run: gcc -O2 -Wall -Wextra -o "$RUNNER_TEMP/iex_last_trade" implementation/tools/iex_hist/iex_last_trade.c
      - name: Disk before
        run: df -h "$RUNNER_TEMP" /
      - name: Probe (counts only)
        env:
          PROBE_DATE: ${{ github.event.inputs.date }}
          PROBE_EXTRA: SKYD,PSKY,WBD,PARA
        run: |
          # Owner request 2026-10-23: the PSKY -> SKYD switch date (listing diagnostics only, counts and status letters).
          for d in 20261002 20261005 20261006 20261007 20261009; do
            echo "== $d"
            python implementation/tools/iex_hist/probe.py --parser "$RUNNER_TEMP/iex_last_trade" --date "$d" | python -c "import json,sys; r=json.load(sys.stdin); print(json.dumps({'date': r['date'], 'minutes': r['elapsed_minutes'], 'universe_no_trade': r['universe_no_trade'], 'diag': {k: r['listing_diagnostics'][k] for k in ('PSKY','SKYD','PARA') if k in r['listing_diagnostics']}}))"
          done
      - name: Disk after
        if: always()
        run: df -h "$RUNNER_TEMP" /
