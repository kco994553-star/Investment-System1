name: private-boundary-push
# Public / private boundary on every push to any branch (security review B2, 2026-10-31; design
# implementation/docs/private_area/PRIVATE_AREA_KIS_DESIGN_20261031.md §20.1). Detection after exposure, not prevention: a
# pushed branch is public at once, and other test jobs run only for pull requests. Static and offline: no Secret, no
# network call besides installing pytest, read-only token, no artifact, no cache, no step summary. Every push runs
# (no concurrency group), so a file pushed and then removed by a later push is still reported.
on:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Public / private boundary static test
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1
          PYTHONPATH=src python -m pytest -q --tb=short -p no:cacheprovider tests/test_private_boundary_static.py
