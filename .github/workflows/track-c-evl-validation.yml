name: track-c-evl-validation
on:
  push:
    branches: [feature/track-c-evl]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Targeted C0 regression
        run: PYTHONPATH=src python -m pytest -q tests/test_evl_c0.py
      - name: Full regression
        run: PYTHONPATH=src python -m pytest -q
