name: browser-date-shift
# Browser tests with "now" moved forward (owner 2026-11-16, options (b) and (c)): finds tests that expect today's
# date before the day comes, like the 2026-11-16 daily verify failure (run 43789394850, fixed in #566).
# It is its own workflow and gates nothing: a failure here never blocks Pages or the daily publication. GitHub
# notifies the account that last edited the schedule when a scheduled run fails; the run summary names the tests.
# Excluded from the shifted run only, with reasons: implementation/tools/ci_browser_tests_date_shift_exclude.txt.
on:
  schedule:
    - cron: '17 19 * * *'   # daily 19:17 UTC (04:17 KST): +7 days
    - cron: '47 19 * * 6'   # Saturday 19:47 UTC (Sunday 04:47 KST): +50 days (month and year boundaries)
  pull_request:
    # Only a PR that changes this check itself runs it (both shifts); ordinary PRs do not.
    paths:
      - .github/workflows/browser-date-shift.yml
      - implementation/tools/clock_shift_preload.js
      - implementation/tools/run_js_tests_date_shift.sh
      - implementation/tools/ci_browser_tests_date_shift_exclude.txt
permissions:
  contents: read
concurrency:
  group: browser-date-shift-${{ github.event.schedule || github.ref }}
  cancel-in-progress: false
jobs:
  shifted:
    runs-on: ubuntu-24.04
    # One shifted browser list takes about 26 minutes; a PR run does both shifts.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and inspect local price-free cockpit
        run: |
          python -m pip install jsonschema==4.26.0
          python implementation/tools/build_pages_cockpit.py --out "$RUNNER_TEMP/public-cockpit"
          python implementation/tools/pages_artifact_guard.py --artifact-dir "$RUNNER_TEMP/public-cockpit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Browser tests with the clock moved forward
        env:
          NODE_PATH: ${{ runner.temp }}/pages-browser/node_modules
          PAGES_COCKPIT_URL: http://127.0.0.1:8990/
          PRIVATE_HISTORY_URL: http://127.0.0.1:8990/
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '17 19 * * *') shifts='7' ;;
            '47 19 * * 6') shifts='50' ;;
            '') shifts='7 50' ;;
            *) echo "UNKNOWN_SCHEDULE"; exit 1 ;;
          esac
          npm install --prefix "$RUNNER_TEMP/pages-browser" playwright@1.58.2
          "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8990 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public-cockpit" > "$RUNNER_TEMP/pages-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          status=0
          for days in $shifts; do
            bash implementation/tools/run_js_tests_date_shift.sh implementation/tools/ci_browser_tests.txt implementation/tools/ci_browser_tests_date_shift_exclude.txt "$days" || status=1
          done
          exit "$status"
