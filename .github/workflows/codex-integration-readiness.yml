name: codex-integration-readiness
on:
  pull_request:
    paths:
      - '.github/workflows/codex-integration-readiness.yml'
      - 'implementation/tools/c28_integration_compat.py'
      - 'implementation/tools/producer_source_compat.py'
      - 'implementation/tools/*producer*compat*.py'
      - 'implementation/tools/build_producer_contract_web_fixture.py'
      - 'implementation/tools/producer_contract_web_browser_test.js'
      - 'implementation/tests/test_c28_integration_compat.py'
      - 'implementation/tests/test_producer_source_compat.py'
      - 'implementation/tests/test_*producer_infra_compat.py'
      - 'implementation/tests/test_rig_news_ingest.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-integration-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  combined-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Exact source checkpoint
        run: git rev-parse HEAD
      - name: Preserve exact owner Track C and canonical Track A evidence
        run: |
          git diff --exit-code b9e01a976a0e9efcd1f2d3a5d3503d2795cc5565 -- implementation/src/investment_system/evl implementation/tests/evl_c8_fixture.py implementation/tests/evl_c8_gsup_oracle.py 'implementation/tests/test_evl_*.py'
          git diff --exit-code b8e39a2196a6d7794a04a0cd5393c68329e126ca -- implementation/reports/gate_evidence implementation/data
          git diff --exit-code b9e01a976a0e9efcd1f2d3a5d3503d2795cc5565 -- implementation/src/investment_system/technical/engine.py implementation/src/investment_system/macro/engine.py implementation/src/investment_system/contracts/models.py implementation/src/investment_system/contracts/lineage.py
      - name: Full existing regression with actual integrated dependencies
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q --junitxml=/tmp/combined-junit.xml
      - name: Producer to existing Web withheld-contract fixture
        run: python implementation/tools/build_producer_contract_web_fixture.py --out /tmp/withheld-web --evidence /tmp/withheld-web-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser tooling
        run: npm install --prefix /tmp/contract-browser playwright@1.58.2
      - name: Install Chromium
        run: /tmp/contract-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Withheld publication, locales, mobile, loading and retry E2E
        env:
          NODE_PATH: /tmp/contract-browser/node_modules
        run: node implementation/tools/producer_contract_web_browser_test.js --dir /tmp/withheld-web --evidence /tmp/withheld-web-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-integration-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/combined-junit.xml
            /tmp/withheld-web-evidence
  macro-adoption-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4a07099e36ec3cecda24b82ecedad53800f0aa81'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Exact existing Macro adoption proposal; offline only
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q tests/test_macro_real_producer.py --junitxml=/tmp/macro-adoption-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-adoption-4a07099e36ec3cecda24b82ecedad53800f0aa81
          path: /tmp/macro-adoption-junit.xml
