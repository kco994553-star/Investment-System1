name: track-c-fpia
# Hardened Track C Frozen Projection Identity Audit (CDR-014). Read-only: it never pushes, comments
# or writes refs on the remote. R and V come only from the authenticated CDR manifest (no reference
# inputs). On pull_request the audit subject is the PR head commit (not the synthetic merge commit)
# and the register commit is the authority handoff-branch tip read with git ls-remote; on
# workflow_dispatch both are inputs (subject default: the checked-out commit).
# PIW-D006: authenticated ancestry/content/import applicability, independent of branch spelling.
# OUTSIDE_SCOPE_NOT_RUN is not a Frozen PASS or integration acceptance.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      register_commit:
        description: "40-hex commit of the coordination register on integration/global-handoff-v1"
        required: true
      cdr:
        description: "CDR section carrying the fpia-reference-manifest"
        required: true
        default: "CDR-014"
      tree:
        description: "40-hex audit subject (merge-result commit); empty = the checked-out commit"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  fpia:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Free runner disk (an audit needs about 5 GB of work space)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout workflow execution source independently of subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .fpia-verifier
          fetch-depth: 0
      - name: Fetch every branch for the object store (read-only)
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime (FPIA's workflow loader is the vendored PyYAML 6.0.1, AC-32.spoof)
        run: python -m pip install pytest==9.1.1 numpy==2.3.5
      - name: Branch-independent authenticated applicability
        id: applicability
        env:
          FPIA_REGISTER_COMMIT: ${{ inputs.register_commit }}
          FPIA_CDR: ${{ inputs.cdr }}
          FPIA_TREE: ${{ inputs.tree || github.event.pull_request.head.sha }}
        run: |
          tree="${FPIA_TREE:-$GITHUB_SHA}"
          register="$FPIA_REGISTER_COMMIT"
          if [ -z "$register" ]; then
            register="$(git ls-remote origin refs/heads/integration/global-handoff-v1 | cut -f1)"
          fi
          out="$RUNNER_TEMP/fpia-out"
          mkdir -p "$out"
          python .fpia-verifier/implementation/tools/integration/track_c_fpia_applicability.py --repo . \
            --tree "$tree" --register-commit "$register" --cdr "${FPIA_CDR:-CDR-014}" \
            --out "$out/fpia-applicability.json"
          python - "$out/fpia-applicability.json" >> "$GITHUB_OUTPUT" <<'PYCODE'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print("applies=" + ("true" if doc["status"] == "APPLIES" else "false"))
          PYCODE
          echo 'Applicability receipt is not Frozen PASS or integration acceptance.' >> "$GITHUB_STEP_SUMMARY"
          cat "$out/fpia-applicability.json" >> "$GITHUB_STEP_SUMMARY"
      - name: FPIA Tier 1 tests
        if: github.event_name == 'workflow_dispatch' && steps.applicability.outputs.applies == 'true'
        working-directory: .fpia-verifier/implementation
        run: PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_integration_fpia_*.py
      - name: FPIA Tier 2 real-history checks (must not skip)
        if: github.event_name == 'workflow_dispatch' && steps.applicability.outputs.applies == 'true'
        working-directory: .fpia-verifier/implementation
        env:
          FPIA_REQUIRE_HISTORY: "1"
        run: PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/integration_fpia_real_history_checks.py
      - name: FPIA audit (the job fails only on FPIA_FAIL or FPIA_NOT_RUN)
        if: steps.applicability.outputs.applies == 'true'
        env:
          FPIA_REGISTER_COMMIT: ${{ inputs.register_commit }}
          FPIA_CDR: ${{ inputs.cdr }}
          FPIA_TREE: ${{ inputs.tree || github.event.pull_request.head.sha }}
        run: |
          tree="${FPIA_TREE:-$GITHUB_SHA}"
          cdr="${FPIA_CDR:-CDR-014}"
          register="$FPIA_REGISTER_COMMIT"
          if [ -z "$register" ]; then
            register="$(git ls-remote origin refs/heads/integration/global-handoff-v1 | cut -f1)"
          fi
          echo "audit subject T=$tree register_commit=$register cdr=$cdr event=$GITHUB_EVENT_NAME"
          out="$RUNNER_TEMP/fpia-out"
          mkdir -p "$out"
          set +e
          python .fpia-verifier/implementation/tools/integration/track_c_fpia.py --repo . --tree "$tree" \
            --register-commit "$register" --cdr "$cdr" --out "$out/fpia.json" > "$out/fpia-summary.txt"
          rc=$?
          set -e
          python - "$out/fpia.json" > "$out/fpia-status.txt" <<'PY' || true
          import json
          import sys
          doc = json.load(open(sys.argv[1]))
          r = doc["result"]
          print("fpia: %s" % r["fpia"]["status"])
          for reason in r["fpia"].get("reasons", []):
              print("  reason: %s" % reason)
          for name, value in sorted(r["statuses"].items()):
              print("%s: %s" % (name, value))
          print("result_sha256: %s" % doc["result_sha256"])
          PY
          # G4/H4: recheck the written output and its side files and print run_sha256 (integrity of the
          # written run section, not authentication - open decision D3-a); informational, never changes
          # the exit code
          python .fpia-verifier/implementation/tools/integration/track_c_fpia.py --verify-output "$out/fpia.json" \
            > "$out/fpia-verify.txt" 2>&1 || true
          {
            echo "### Track C FPIA (CDR-014)"
            echo ""
            echo "Subject T: $tree (event $GITHUB_EVENT_NAME). CODE_IDENTITY_DIVERGED is reported as fact;"
            echo "FROZEN_TOOLS_ON_T is a separate verbatim BRANCH_FROZEN_VALIDATION class; exit 0 is not a"
            echo "Frozen PASS and not merge approval. Exit code: $rc (0 PASS, 1 FAIL, 2 NOT_RUN)."
            echo ""
            echo '```'
            cat "$out/fpia-summary.txt"
            cat "$out/fpia-status.txt"
            tail -n 2 "$out/fpia-verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out/fpia-summary.txt"
          cat "$out/fpia-status.txt"
          tail -n 2 "$out/fpia-verify.txt"
          exit $rc
      - name: Record workflow execution source (observation only; no acceptance)
        if: always()
        env:
          FPIA_REPOSITORY: ${{ github.repository }}
          FPIA_WORKFLOW_SHA: ${{ github.workflow_sha }}
          FPIA_WORKFLOW_REF: ${{ github.workflow_ref }}
          FPIA_EVENT_SHA: ${{ github.sha }}
          FPIA_SUBJECT_SHA: ${{ inputs.tree || github.event.pull_request.head.sha || github.sha }}
          FPIA_RUN_ID: ${{ github.run_id }}
          FPIA_RUN_ATTEMPT: ${{ github.run_attempt }}
          FPIA_JOB_KEY: ${{ github.job }}
          FPIA_EVENT_NAME: ${{ github.event_name }}
        run: |
          out="$RUNNER_TEMP/fpia-out"
          mkdir -p "$out"
          # Old receipts remain unchanged. Missing facts stay UNAVAILABLE, never subject fallback.
          python .fpia-verifier/implementation/tools/integration/track_c_fpia_ci_receipt.py --repo .fpia-verifier --workflow-source \
            --verifier-path implementation/tools/integration \
            > "$out/fpia-ci-receipt.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-c-fpia-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/fpia-out/
