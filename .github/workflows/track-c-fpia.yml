name: track-c-fpia
# Hardened Track C Frozen Projection Identity Audit (CDR-014). Dispatch-only and read-only:
# it never pushes, comments or writes refs on the remote. The audited subject defaults to the
# checked-out commit; R and V come only from the authenticated CDR manifest (no reference inputs).
on:
  workflow_dispatch:
    inputs:
      register_commit:
        description: "40-hex commit of the coordination register on integration/global-handoff-v1"
        required: true
      cdr:
        description: "CDR section carrying the fpia-reference-manifest"
        required: true
        default: "CDR-014"
      tree:
        description: "40-hex audit subject (merge-result commit); empty = the checked-out commit"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  fpia:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch for the object store (read-only)
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime
        run: python -m pip install pytest==9.1.1 numpy==2.3.5
      - name: FPIA Tier 1 tests
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_integration_fpia_*.py
      - name: FPIA Tier 2 real-history checks (must not skip)
        working-directory: implementation
        env:
          FPIA_REQUIRE_HISTORY: "1"
        run: PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/integration_fpia_real_history_checks.py
      - name: FPIA audit
        env:
          FPIA_REGISTER_COMMIT: ${{ inputs.register_commit }}
          FPIA_CDR: ${{ inputs.cdr }}
          FPIA_TREE: ${{ inputs.tree }}
        run: |
          tree="${FPIA_TREE:-$GITHUB_SHA}"
          set +e
          python implementation/tools/integration/track_c_fpia.py --repo . --tree "$tree" \
            --register-commit "$FPIA_REGISTER_COMMIT" --cdr "$FPIA_CDR" --out "$RUNNER_TEMP/fpia.json" \
            > "$RUNNER_TEMP/fpia-summary.txt"
          rc=$?
          set -e
          {
            echo "### Track C FPIA (CDR-014)"
            echo ""
            echo "Six-component result (CODE_IDENTITY_DIVERGED is reported as fact; FROZEN_TOOLS_ON_T is a separate"
            echo "verbatim BRANCH_FROZEN_VALIDATION class; exit 0 is not a Frozen PASS and not merge approval):"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/fpia-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/fpia-summary.txt"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-c-fpia-${{ github.sha }}
          path: ${{ runner.temp }}/fpia.json
