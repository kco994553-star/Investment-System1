# C-21 network-enabled runner. Runs the EXISTING tools unchanged on a GitHub-hosted
# runner (which has outbound HTTPS), because the Claude cloud container's egress
# policy denies sec.gov / data.sec.gov / Yahoo.
#   fetch_real_data.py --plan  -> fetch_real_data.py (resume plan) -> run_top500_gate_chain.py
# Raw store persistence: actions/cache (resume across runs, no re-download) + a run
# artifact (tar.zst of implementation/data/raw). Only small evidence (manifests,
# STORE_INDEX, ingest logs, gate-chain report) is committed back to the branch.
name: c21-real-data
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "PIT as-of date for the gate chain"
        default: "2024-12-31"
        required: true
      skip_fetch:
        description: "true = only re-run the gate chain on the cached store"
        default: "false"
        required: true
      seed_run_id:
        description: "run whose c21-raw-store-<id> artifact seeds the store when no cache exists"
        default: "36117017112"
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: c21-real-data
  cancel-in-progress: false
jobs:
  ingest-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: implementation
    env:
      INVESTMENT_SYSTEM_SEC_UA: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require SEC contact User-Agent (SEC fair-access policy)
        if: inputs.skip_fetch != 'true'
        run: |
          if [ -z "$INVESTMENT_SYSTEM_SEC_UA" ]; then
            echo "::error::Set repository secret SEC_USER_AGENT, e.g. 'Name contact@example.com'"; exit 1; fi
      - name: Restore persistent raw store
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: implementation/data/raw
          key: c21-raw-store-v2-${{ github.run_id }}
          restore-keys: c21-raw-store-v2-
      - name: Seed raw store from a previous run artifact (no cache yet)
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v4
        with:
          name: c21-raw-store-${{ inputs.seed_run_id }}
          run-id: ${{ inputs.seed_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/seed
      - name: Merge seeded blobs into the store
        if: steps.restore.outputs.cache-matched-key == ''
        run: |
          SRC=$(dirname "$(find /tmp/seed -type d -path '*data/raw/blobs' | head -1)")
          test -n "$SRC" && cp -rn "$SRC"/. data/raw/ || echo "::warning::no seed store found"
          echo "blobs after seed: $(ls data/raw/blobs | wc -l)"
      - name: Offline test baseline
        run: python tools/mini_pytest.py | tail -1
      - name: Fetch missing-large-cap priority plan (257 CIK-ready + 25 via sec_tickers)
        if: inputs.skip_fetch != 'true'
        run: |
          python tools/fetch_real_data.py --store data/raw --with-split-events \
            --plan reports/gate_evidence/missing_large_cap_priority_plan_2024-12-31.json > /tmp/run_plan.json
          python - <<'PY'
          import json, collections
          d = json.load(open('/tmp/run_plan.json'))
          print(d['n_requested'], d['n_ok'], d['n_failed'], collections.Counter(r['status'] for r in d['log']))
          print(collections.Counter(r['method'] for r in d['plan_resolution'] or []))
          PY
      - name: Fetch resume plan (lost 598-pool blobs; present artifacts are skipped)
        if: inputs.skip_fetch != 'true'
        run: |
          CIKS=$(python -c "import json;print(','.join(json.load(open('reports/gate_evidence/c21_resume_plan_2024-12-31.json'))['ciks']))")
          SYMS=$(python -c "import json;print(','.join(json.load(open('reports/gate_evidence/c21_resume_plan_2024-12-31.json'))['symbols']))")
          python tools/fetch_real_data.py --store data/raw --skip-tickers --with-split-events --ciks "$CIKS" --symbols "$SYMS" > /tmp/run_resume.json
          python -c "import json,collections;d=json.load(open('/tmp/run_resume.json'));print(d['n_requested'],d['n_ok'],d['n_failed'],collections.Counter(r['status'] for r in d['log']))"
      - name: Refresh once the Yahoo charts with no bar on/before as_of (HTTP 200 but truncated; old bytes archived in history/)
        if: inputs.skip_fetch != 'true'
        run: |
          EMPTY=$(AS_OF="${{ inputs.as_of }}" python - <<'PY'
          import os, sys
          from datetime import datetime
          sys.path.insert(0, 'src')
          from investment_system.ingestion.raw_store import RawDatasetStore
          from investment_system.ingestion.replay import load_price_bars
          st = RawDatasetStore('data/raw')
          d = datetime.fromisoformat(os.environ['AS_OF'] + 'T23:59:59+00:00')
          ids = [a for a in st.list_ids() if a.startswith('yahoo_chart:') and a.endswith(':5y') and st.has(a)]
          # never refreshed before (no history) and no usable as-of bar -> one refresh only
          print(','.join(a.split(':')[1] for a in ids if not st.list_history(a)
                         and not any(b['observed_at'] <= d for b in load_price_bars(st, a.split(':')[1], '5y'))))
          PY
          )
          echo "empty charts: ${EMPTY:-none}"
          if [ -n "$EMPTY" ]; then
            python tools/fetch_real_data.py --store data/raw --skip-tickers --refresh --symbols "$EMPTY" > /tmp/run_refresh.json
            python -c "import json,collections;d=json.load(open('/tmp/run_refresh.json'));print(d['n_requested'],d['n_ok'],d['n_failed'],collections.Counter(r['status'] for r in d['log']))"
          fi
      - name: Fetch delisted S&P CIK candidates (verified later against SEC submissions names)
        if: inputs.skip_fetch != 'true'
        run: |
          CIKS=$(python -c "import json;print(','.join(c['cik'] for c in json.load(open('reports/gate_evidence/delisted_cik_candidates_2024-12-31.json'))['candidates']))")
          python tools/fetch_real_data.py --store data/raw --skip-tickers --ciks "$CIKS" > /tmp/run_cand.json
          python -c "import json,collections;d=json.load(open('/tmp/run_cand.json'));print(d['n_requested'],d['n_ok'],d['n_failed'],collections.Counter(r['status'] for r in d['log']))"
      - name: Fetch independent PIT reference (Russell 1000 ETF holdings from SEC Form NPORT-P for as_of) and resolve members
        if: inputs.skip_fetch != 'true'
        run: python tools/fetch_nport_reference.py --store data/raw --as-of "${{ inputs.as_of }}"
      - name: Fetch SEC + Yahoo data for reference members not yet in the pool (present artifacts skipped)
        if: inputs.skip_fetch != 'true'
        run: |
          X="reports/gate_evidence/russell1000_extra_listings_${{ inputs.as_of }}.json"
          if [ -f "$X" ]; then
            CIKS=$(python -c "import json;print(','.join(sorted({v['cik'] for v in json.load(open('$X')).values()})))")
            SYMS=$(python -c "import json;print(','.join(sorted({v['yahoo'] for v in json.load(open('$X')).values()})))")
            if [ -n "$CIKS" ]; then
              python tools/fetch_real_data.py --store data/raw --skip-tickers --with-split-events --ciks "$CIKS" --symbols "$SYMS" > /tmp/run_r1000.json
              python -c "import json,collections;d=json.load(open('/tmp/run_r1000.json'));print(d['n_requested'],d['n_ok'],d['n_failed'],collections.Counter(r['status'] for r in d['log']))"
            fi
          fi
      - name: Fetch cover-page XBRL share classes (multi-class / unresolved-shares issuers) + class prices
        if: inputs.skip_fetch != 'true'
        run: |
          X="reports/gate_evidence/russell1000_extra_listings_${{ inputs.as_of }}.json"
          EXTRA=""; [ -f "$X" ] && EXTRA="--extra-listings $X"
          python tools/fetch_cover_xbrl.py --store data/raw --as-of "${{ inputs.as_of }}" $EXTRA
      - name: Tiingo fallback prices for eligible issuers/classes with no as-of Yahoo bar (calibrated, fail-closed)
        if: inputs.skip_fetch != 'true'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          [ -z "$TIINGO_API_KEY" ] && echo "::warning::repository secret TIINGO_API_KEY is not set; no Tiingo prices"
          X="reports/gate_evidence/russell1000_extra_listings_${{ inputs.as_of }}.json"
          EXTRA=""; [ -f "$X" ] && EXTRA="--extra-listings $X"
          python tools/fetch_tiingo_prices.py --store data/raw --as-of "${{ inputs.as_of }}" $EXTRA | head -c 6000
      - name: SEC filings (10-K + 10-Q filed <= as_of) of undetermined multi-class issuers; verbatim class-rights passages
        if: inputs.skip_fetch != 'true'
        run: python tools/fetch_class_rights_evidence.py --store data/raw --as-of "${{ inputs.as_of }}"
      - name: N-PORT reported value per share for the user-approved exception issuers only (PINC, WOLF); CUSIP attestation
        if: inputs.skip_fetch != 'true'
        run: python tools/nport_reported_prices.py --store data/raw --as-of "${{ inputs.as_of }}"
      - name: Share-count diagnostic for PPLI (investigation only; post-as_of facts reported, never applied)
        if: inputs.skip_fetch != 'true'
        run: python tools/share_count_diagnostic.py --store data/raw --as-of "${{ inputs.as_of }}" --cik 0001800227
      - name: Filing documents for issuers whose share count fails the scale cross-check (read by the gate chain)
        if: inputs.skip_fetch != 'true'
        run: |
          X="reports/gate_evidence/russell1000_extra_listings_${{ inputs.as_of }}.json"
          EXTRA=""; [ -f "$X" ] && EXTRA="--extra-listings $X"
          python tools/fetch_share_scale_docs.py --store data/raw --as-of "${{ inputs.as_of }}" $EXTRA
      - name: Recount store
        id: store2
        if: always()
        run: echo "blobs=$(ls data/raw/blobs 2>/dev/null | grep -vc '^.gitkeep$' || true)" >> "$GITHUB_OUTPUT"
      - name: Save persistent raw store (never an empty store)
        if: always() && steps.store2.outputs.blobs != '' && steps.store2.outputs.blobs != '0'
        uses: actions/cache/save@v4
        with:
          path: implementation/data/raw
          key: c21-raw-store-v2-${{ github.run_id }}
      - name: Gate chain (coverage -> rankable -> #500 -> Completeness -> Sufficiency -> Promotion Gate v2)
        run: |
          X="reports/gate_evidence/russell1000_extra_listings_${{ inputs.as_of }}.json"
          R="reports/gate_evidence/russell1000_nport_${{ inputs.as_of }}.json"
          EXTRA=""; [ -f "$X" ] && EXTRA="--extra-listings $X"
          REF=""; [ -f "$R" ] && REF="--sufficiency-reference $R"
          python tools/run_top500_gate_chain.py --store data/raw --as-of "${{ inputs.as_of }}" $EXTRA $REF \
            --out "reports/gate_evidence/gate_chain_${{ inputs.as_of }}_real_gha.json"
      - name: Upload raw store + evidence artifact
        if: always() && steps.store2.outputs.blobs != '' && steps.store2.outputs.blobs != '0'
        uses: actions/upload-artifact@v4
        with:
          name: c21-raw-store-${{ github.run_id }}
          path: |
            implementation/data/raw
            implementation/reports/gate_evidence
          retention-days: 90
      - name: Commit small evidence back (no blobs)
        if: always()
        run: |
          git config user.name "c21-real-data-bot"
          git config user.email "c21-real-data-bot@users.noreply.github.com"
          git add data/raw/manifests data/raw/STORE_INDEX.json reports/gate_evidence
          for f in data/raw/*_run_*.json; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "C-21 real-data run ${{ github.run_id }}: manifests, STORE_INDEX, gate chain evidence"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep $((i*5)); done
