# ONE-TIME MEASUREMENT (owner decision 2026-11-01 item 2: Alpaca SIP small sample only; bulk collection is decided after the
# result; plan implementation/docs/lab/ALPACA_SAMPLE_PLAN_20261101.md). Runs only on the push to the run branch
# claude/alpaca-sample-once-run: never on a PR, a schedule, a manual dispatch or any other branch; the run branch is deleted after
# the run. Alpaca market data v2 daily bars (SIP, raw, 2016-01-01..2019-03-31) for a fixed 40-security sample, 66 requests,
# prices held in RAM. The exact response bytes and a sha256 manifest go ONLY to a NEW release alpaca-sample-v1-<run_id> of the
# private raw repository (create-only; no other release is read, changed or deleted). The log carries fixed ALPSAMPLE_* lines
# (categories, counts, public dates, day differences): never a price, volume, key, token, URL or exception text.
# Alpaca terms: personal, non-commercial use; nothing from this run is published.
name: alpaca-sample-once
on:
  push:
    branches: [claude/alpaca-sample-once-run]
permissions:
  contents: read
concurrency:
  group: alpaca-sample-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/claude/alpaca-sample-once-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Offline first (fakes only, no network, no Secret): a failing check stops the job before any request.
      # --tb=no: a failure names the test only, so no test value reaches the log.
      - name: Offline unit test of the measurement (no network, no Secret)
        working-directory: implementation
        run: |
          python -m pip install pytest==9.1.1
          PYTHONPATH=src python -m pytest -q --tb=no -p no:cacheprovider tests/test_alpaca_sample_once.py
      # The only step that holds Secrets. The script stops with one fixed line when one is missing, checks that the raw
      # repository is private and that the run's release tag does not exist before any Alpaca request, and never prints them.
      - name: Measure the Alpaca SIP small sample (fixed lines only; raw bytes only to a new private release)
        timeout-minutes: 15
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RAW_REPO_TOKEN: ${{ secrets.RAW_REPO_TOKEN }}
        run: |
          umask 077
          python implementation/tools/measure_once/alpaca_sample_once.py
