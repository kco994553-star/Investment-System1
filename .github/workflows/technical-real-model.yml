name: technical-real-model
on:
  pull_request:
  push:
    branches:
      - feature/technical-real-model-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline model tests and full mini_pytest regression
        working-directory: implementation
        run: python tools/mini_pytest.py
