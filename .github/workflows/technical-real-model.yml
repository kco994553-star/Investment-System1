name: technical-real-model
on:
  pull_request:
  push:
    branches:
      - feature/technical-real-model-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native regression runner
        run: python -m pip install pytest==9.1.1
      - name: Offline model tests and full native pytest regression
        working-directory: implementation
        run: PYTHONPATH=src python -m pytest -q
